if (!window.storage) {
  window.storage = {
    async get(key, shared) {
      const raw = localStorage.getItem((shared ? "shared:" : "user:") + key);
      if (raw === null) throw new Error("not found");
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared) {
      localStorage.setItem((shared ? "shared:" : "user:") + key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      localStorage.removeItem((shared ? "shared:" : "user:") + key);
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared) {
      const p = (shared ? "shared:" : "user:") + (prefix || "");
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith(p)) keys.push(k.slice((shared ? "shared:" : "user:").length));
      }
      return { keys, prefix, shared: !!shared };
    },
  };
}

// Reads a File as base64 and uploads it to the coordinator's Drive via the
// Apps Script backend, returning a viewable link. Sent as text/plain (not
// application/json) to avoid a CORS preflight that Apps Script can't answer.
async function uploadSignedLeaveForm(file) {
  const base64Content = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = () => reject(new Error("Couldn't read the file"));
    reader.readAsDataURL(file);
  });
  const res = await fetch(GAS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({
      action: "leave_upload",
      filename: file.name,
      mimeType: file.type || "application/octet-stream",
      base64Content,
    }),
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || "Upload failed");
  return { url: data.url, fileName: data.fileName };
}

function specialtyColor(specialty) {
  const str = String(specialty || "");
  let hash = 0;
  for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
  return SPECIALTY_PALETTE[hash % SPECIALTY_PALETTE.length];
}

const MONTH_NAMES = [
  "january", "february", "march", "april", "may", "june",
  "july", "august", "september", "october", "november", "december",
];

// Parses the real Salmanya-style rota sheet: 3 stacked header rows
// (specialty group -> sub-group -> role), forward-filled across merged
// cells, followed by one data row per day of the month.
function parseRotaSheet(wb, year) {
  const sheetName =
    wb.SheetNames.find((n) => !/phone|contact|meeting|number/i.test(n)) || wb.SheetNames[0];
  const sheet = wb.Sheets[sheetName];
  const grid = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "", raw: false });

  const specialtyRowIdx = grid.findIndex(
    (row) => String(row[0] || "").trim().toUpperCase() === "DATE"
  );
  if (specialtyRowIdx === -1) {
    throw new Error("Couldn't find the header row (looking for \"DATE\" in column A)");
  }

  const specialtyRow = grid[specialtyRowIdx] || [];
  const subGroupRow = grid[specialtyRowIdx + 1] || [];
  const roleRow = grid[specialtyRowIdx + 2] || [];

  // The sheet repeats a second DATE/DAY pair further right — stop before it.
  let endCol = specialtyRow.length;
  for (let c = 2; c < specialtyRow.length; c++) {
    if (String(specialtyRow[c] || "").trim().toUpperCase() === "DATE") {
      endCol = c;
      break;
    }
  }

  const colMeta = [];
  let currentSpecialty = "";
  let currentSub = "";
  for (let c = 2; c < endCol; c++) {
    const specVal = String(specialtyRow[c] || "").trim();
    if (specVal) {
      currentSpecialty = specVal.replace(/\s+/g, " ");
      currentSub = "";
    }
    const subValOwn = String(subGroupRow[c] || "").trim();
    if (subValOwn) currentSub = subValOwn;
    const roleValOwn = String(roleRow[c] || "").trim();
    if (!currentSpecialty) continue;

    let role;
    if (roleValOwn) {
      // Leaf role, e.g. "Emergency"/"Wards" under a subgroup like "Early"
      role = currentSub ? `${currentSub} ${roleValOwn}` : roleValOwn;
    } else if (subValOwn) {
      // Standalone role with no further split, e.g. "Morning", "24 HR OT"
      role = subValOwn;
    } else {
      continue; // decorative column, no header info
    }
    colMeta.push({ col: c, specialty: currentSpecialty, role });
  }
  if (!colMeta.length) throw new Error("Couldn't map any role columns under the specialty headers");

  let dataStart = specialtyRowIdx + 3;
  while (dataStart < grid.length && !/^\d{1,2}$/.test(String((grid[dataStart] || [])[0] || "").trim())) {
    dataStart++;
  }
  if (dataStart >= grid.length) throw new Error("Couldn't find the first data row (day 1)");

  let monthIdx = new Date().getMonth();
  for (let r = 0; r < Math.min(5, grid.length); r++) {
    const text = (grid[r] || []).join(" ").toLowerCase();
    const found = MONTH_NAMES.findIndex((m) => text.includes(m));
    if (found !== -1) {
      monthIdx = found;
      break;
    }
  }

  const rows = [];
  let currentMonth = monthIdx;
  let currentYear = year;
  let prevDayNum = null;
  for (let r = dataStart; r < grid.length; r++) {
    const row = grid[r] || [];
    const dayNumRaw = String(row[0] || "").trim();
    if (!/^\d{1,2}$/.test(dayNumRaw)) break;
    const dayNum = parseInt(dayNumRaw, 10);
    // A day number lower than the previous row means the month rolled over
    // (e.g. remaining Aug days followed by all of Sept in the same sheet).
    if (prevDayNum !== null && dayNum < prevDayNum) {
      currentMonth += 1;
      if (currentMonth > 11) {
        currentMonth = 0;
        currentYear += 1;
      }
    }
    prevDayNum = dayNum;
    const dayLabel = String(row[1] || "").trim();
    const mm = String(currentMonth + 1).padStart(2, "0");
    const dd = String(dayNum).padStart(2, "0");
    const date = `${currentYear}-${mm}-${dd}`;

    colMeta.forEach(({ col, specialty, role }) => {
      const raw = String(row[col] || "").trim();
      if (!raw) return;
      raw.split("/").forEach((part) => {
        const name = part.trim();
        if (name) rows.push({ date, day: dayLabel, specialty, role, name });
      });
    });
  }
  if (!rows.length) throw new Error("No rota rows could be read from this file");
  return rows;
}

// Parses the "Telephone Numbers" style sheet: repeating (Specialty, Mobile/Contact)
// column pairs, one name+number per row underneath. An optional leading
// "No." column per group is ignored.
function parseDirectorySheet(wb) {
  const sheetName = wb.SheetNames.find((n) => /phone|contact|number/i.test(n));
  if (!sheetName) return [];
  const sheet = wb.Sheets[sheetName];
  const grid = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "", raw: false });
  if (!grid.length) return [];
  const header = grid[0] || [];

  const pairs = [];
  for (let c = 1; c < header.length; c++) {
    const label = String(header[c] || "").trim();
    if (!label || /^mobile$|^contact$/i.test(label) || /^no\.?$/i.test(label)) continue;
    const nextLabel = String(header[c + 1] || "").trim();
    if (/^mobile$|^contact$/i.test(nextLabel)) {
      pairs.push({ specialty: label.replace(/\s+/g, " "), nameCol: c, mobileCol: c + 1 });
    }
  }
  if (!pairs.length) return [];

  const entries = [];
  for (let r = 1; r < grid.length; r++) {
    const row = grid[r] || [];
    pairs.forEach(({ specialty, nameCol, mobileCol }) => {
      const name = String(row[nameCol] || "").trim();
      if (!name) return;
      const mobile = String(row[mobileCol] || "").trim();
      entries.push({ specialty, name, mobile });
    });
  }
  return entries;
}

function formatDatePretty(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("en-GB", { weekday: "short", day: "2-digit", month: "short" });
}

function formatMonthLabel(ym) {
  if (!ym) return "";
  const [y, m] = ym.split("-").map(Number);
  const d = new Date(y, m - 1, 1);
  return d.toLocaleDateString("en-GB", { month: "short", year: "numeric" });
}

// Reduces rota rows to one representative row per date — a day with
// multiple roles (e.g. Early Emergency + Late Wards) is identified by
// its Emergency role, since that's how Juniors refer to the day.
// Names typed into Account may differ slightly in case/whitespace from
// how they're spelled in the rota Excel — always compare normalized.
function sameName(a, b) {
  return String(a || "").trim().toLowerCase() === String(b || "").trim().toLowerCase();
}

function collapseByDay(rows) {
  // Morning is a distinct shift from the day's main on-call role — it
  // should never be merged away, only the *other* roles on the same day
  // get collapsed down to one (preferring the Emergency one, if any).
  const morningRows = rows.filter((r) => r.role.trim().toLowerCase() === "morning");
  const otherRows = rows.filter((r) => r.role.trim().toLowerCase() !== "morning");

  const byDate = {};
  otherRows.forEach((r) => {
    byDate[r.date] = byDate[r.date] || [];
    byDate[r.date].push(r);
  });
  const collapsedOther = [];
  Object.values(byDate).forEach((group) => {
    const emergencyOne = group.find((r) => r.role.toLowerCase().includes("emergency"));
    collapsedOther.push(emergencyOne || group[0]);
  });

  return [...collapsedOther, ...morningRows];
}

// For a JUNIOR or non-Team-Leader SENIORS row, shows who's Team Leading
// that day. For the Team Leader's own row, shows which other Seniors are
// covering the same day. Currently only meaningful for General Surgery's
// JUNIOR/SENIORS teams, since other specialties don't use Team Leader.
function getRotaCompanions(allRows, row) {
  const isJunior = row.specialty === "JUNIOR";
  const isSenior = row.specialty === "SENIORS";
  const isConsultant = row.specialty === "Consultant General Surgery";
  if (!isJunior && !isSenior && !isConsultant) return null;
  const isTeamLeader = isSenior && row.role.trim().toLowerCase() === "team leader";

  // Consultant on call — General and Trauma only. Bariatric isn't part of
  // the same-day escalation chain the rest of the team needs to know about.
  const consultants = allRows.filter(
    (r) =>
      r.date === row.date &&
      r.specialty === "Consultant General Surgery" &&
      ["general", "trauma"].includes(r.role.trim().toLowerCase())
  );
  const consultantNames = consultants.length
    ? Array.from(new Set(consultants.map((c) => `${c.name} (${c.role.trim()})`)))
    : null;

  const result = {};

  // Everyone except the Team Leader themself sees who's Team Leading.
  if (!isTeamLeader) {
    const teamLeader = allRows.find(
      (r) => r.date === row.date && r.specialty === "SENIORS" && r.role.trim().toLowerCase() === "team leader"
    );
    if (teamLeader && !sameName(teamLeader.name, row.name)) result.teamLeader = teamLeader;
  }

  if (!isConsultant && consultantNames) result.consultants = consultantNames;

  // Everyone (Junior, Senior, Team Leader, Consultant) sees the same
  // ordered Morning/Early/Middle/Late Seniors lineup — with the viewer's
  // own name left out if they happen to be one of those Seniors.
  const periodOrder = ["Morning", "Early", "Middle", "Late"];
  const seniorsByPeriod = periodOrder
    .map((period) => {
      const senior = allRows.find(
        (r) =>
          r.date === row.date &&
          r.specialty === "SENIORS" &&
          r.role.trim().toLowerCase() === period.toLowerCase() &&
          !sameName(r.name, row.name)
      );
      return senior ? `${period}: ${senior.name}` : null;
    })
    .filter(Boolean);
  if (seniorsByPeriod.length) result.seniorsByPeriod = seniorsByPeriod;

  return Object.keys(result).length ? result : null;
}

// Builds an .ics file (all-day events, one per call) that iOS/Android
// Calendar apps can import directly when the file is opened.
function buildICS(rows) {
  const pad = (n) => String(n).padStart(2, "0");
  const toICSDate = (iso) => iso.replace(/-/g, "");
  const nextDayICS = (iso) => {
    const d = new Date(iso + "T00:00:00");
    d.setDate(d.getDate() + 1);
    return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  };
  const now = new Date();
  const stamp = `${now.getUTCFullYear()}${pad(now.getUTCMonth() + 1)}${pad(now.getUTCDate())}T${pad(
    now.getUTCHours()
  )}${pad(now.getUTCMinutes())}${pad(now.getUTCSeconds())}Z`;

  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Surgical Rota//EN", "CALSCALE:GREGORIAN"];
  rows.forEach((r, i) => {
    lines.push("BEGIN:VEVENT");
    lines.push(`UID:${r.date}-${i}-${Date.now()}@surgical-rota`);
    lines.push(`DTSTAMP:${stamp}`);
    lines.push(`DTSTART;VALUE=DATE:${toICSDate(r.date)}`);
    lines.push(`DTEND;VALUE=DATE:${nextDayICS(r.date)}`);
    lines.push(`SUMMARY:${r.specialty} \u2013 ${r.role}`);
    lines.push("END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}

// ---- Main App ---------------------------------------------------------------
function RotaApp() {
  const [tab, setTab] = useState("today");
  const [rota, setRota] = useState({ rows: [], updatedAt: null });
  // The background interval below is set up once and its syncNow closure
  // would otherwise keep referencing whatever rota.rows was at that exact
  // moment forever — this ref always reads the *current* value instead,
  // regardless of when the closure was created.
  const rotaRef = useRef(rota.rows);
  useEffect(() => {
    rotaRef.current = rota.rows;
  }, [rota.rows]);
  const [directory, setDirectory] = useState({ entries: [], updatedAt: null });
  const [morningMeeting, setMorningMeeting] = useState({ entries: [], updatedAt: null });
  const [leaves, setLeaves] = useState([]);
  const [swaps, setSwaps] = useState([]);
  const [currentUser, setCurrentUser] = useState("");
  const [currentRole, setCurrentRole] = useState("doctor");
  const [nameDraft, setNameDraft] = useState("");
  const [roleDraft, setRoleDraft] = useState("doctor");
  const [loading, setLoading] = useState(true);
  const [uploadError, setUploadError] = useState("");
  const [uploading, setUploading] = useState(false);
  const [uploadConflicts, setUploadConflicts] = useState([]);
  const [rotaYear, setRotaYear] = useState(new Date().getFullYear());
  const [selectedDate, setSelectedDate] = useState(todayISO());
  const [syncing, setSyncing] = useState(false);
  const [syncError, setSyncError] = useState("");
  const [lastSynced, setLastSynced] = useState(null);
  const fileRef = useRef(null);

  // Load persisted state
  useEffect(() => {
    (async () => {
      try {
        const [r, l, u, d, sw, mm] = await Promise.allSettled([
          window.storage.get("rota-data", true),
          window.storage.get("leave-requests", true),
          window.storage.get("current-user", false),
          window.storage.get("directory-data", true),
          window.storage.get("swap-requests", true),
          window.storage.get("morning-meeting-data", true),
        ]);
        if (r.status === "fulfilled" && r.value) {
          setRota(JSON.parse(r.value.value));
        }
        if (l.status === "fulfilled" && l.value) {
          setLeaves(JSON.parse(l.value.value));
        }
        if (u.status === "fulfilled" && u.value) {
          const v = JSON.parse(u.value.value);
          setCurrentUser(v.name || "");
          setCurrentRole(v.role || "doctor");
        }
        if (d.status === "fulfilled" && d.value) {
          setDirectory(JSON.parse(d.value.value));
        }
        if (sw.status === "fulfilled" && sw.value) {
          setSwaps(JSON.parse(sw.value.value));
        }
        if (mm.status === "fulfilled" && mm.value) {
          setMorningMeeting(JSON.parse(mm.value.value));
        }
      } catch (e) {
        // no data yet — fine
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  const syncNow = async (opts = {}) => {
    const { fullRefresh = false } = opts;
    setSyncing(true);
    setSyncError("");
    try {
      const scope = fullRefresh ? "all" : "current";
      const [fetchedRows, leavesData, swapsData, directoryEntries, morningMeetingEntries] = await Promise.all([
        fetchRotaFromSheet(scope),
        fetchLeavesFromSheet(),
        fetchSwapsFromSheet(),
        fetchDirectoryFromSheet(),
        fetchMorningMeetingFromSheet(),
      ]);

      // The routine background poll only re-fetches the current month's
      // tab (fast) — merge it into whatever's already cached rather than
      // replacing everything, so older months stay available without
      // needing a full re-read every ~45 seconds.
      let rows;
      if (scope === "all") {
        rows = fetchedRows;
      } else {
        const fetchedDates = new Set(fetchedRows.map((r) => r.date));
        const keptOld = rotaRef.current.filter((r) => !fetchedDates.has(r.date));
        rows = [...keptOld, ...fetchedRows];
      }

      const payload = { rows, updatedAt: new Date().toISOString() };
      await window.storage.set("rota-data", JSON.stringify(payload), true);
      setRota(payload);
      setLeaves(leavesData);
      setSwaps(swapsData);

      // Re-check approved leaves against the freshly-synced rota every time —
      // a leave submitted a month ahead (before that month's rota existed)
      // won't have shown a conflict at submission time, so this is what
      // catches it once the real rota for that period arrives.
      const approvedLeaves = leavesData.filter((l) => l.status === "approved");
      const newConflicts = [];
      approvedLeaves.forEach((l) => {
        rows.forEach((r) => {
          if (
            r.name.toLowerCase().trim() === l.name.toLowerCase().trim() &&
            r.date >= l.startDate &&
            r.date <= l.endDate
          ) {
            newConflicts.push({ name: r.name, date: r.date, specialty: r.specialty, role: r.role, leave: l });
          }
        });
      });
      setUploadConflicts(newConflicts);

      const dirPayload = { entries: directoryEntries, updatedAt: new Date().toISOString() };
      await window.storage.set("directory-data", JSON.stringify(dirPayload), true);
      setDirectory(dirPayload);

      const mmPayload = { entries: morningMeetingEntries, updatedAt: new Date().toISOString() };
      await window.storage.set("morning-meeting-data", JSON.stringify(mmPayload), true);
      setMorningMeeting(mmPayload);

      setLastSynced(new Date());
    } catch (e) {
      setSyncError(e.message || "Couldn't sync from Google Sheets");
    } finally {
      setSyncing(false);
    }
  };

  // Auto-sync from Sheets once on load, after cached data is shown. This is
  // a full refresh (every tab) so nothing's missing on first load.
  useEffect(() => {
    if (!loading) {
      syncNow({ fullRefresh: true });
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loading]);

  // Keep syncing in the background so new requests/approvals from other
  // people show up without anyone needing to remember to tap "Sync now".
  // Scoped to the current month only — much faster, and older months
  // don't change once the month is over anyway.
  useEffect(() => {
    if (loading) return;
    const interval = setInterval(() => {
      syncNow();
    }, 45000);
    return () => clearInterval(interval);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loading]);

  const saveUser = async (name, role) => {
    setCurrentUser(name);
    setCurrentRole(role);
    try {
      await window.storage.set("current-user", JSON.stringify({ name, role }), false);
    } catch (e) {}
  };

  const specialties = useMemo(() => {
    const s = new Set(rota.rows.map((r) => r.specialty).filter(Boolean));
    return Array.from(s);
  }, [rota.rows]);

  const myRows = useMemo(
    () =>
      rota.rows
        .filter((r) => r.name.toLowerCase().trim() === currentUser.toLowerCase().trim())
        .filter((r) => r.date >= todayISO())
        .sort((a, b) => a.date.localeCompare(b.date)),
    [rota.rows, currentUser]
  );

  const allNames = useMemo(() => {
    const s = new Set(rota.rows.map((r) => r.name).filter((n) => n && n !== currentUser));
    return Array.from(s).sort();
  }, [rota.rows, currentUser]);

  const requestSwap = async (fromDate, toName, toDate, note) => {
    const trimmedTo = toName.trim();
    if (!trimmedTo) return;
    const fromOwnRows = rota.rows.filter((r) => r.date === fromDate && sameName(r.name, currentUser));
    const toOwnRows = rota.rows.filter((r) => r.date === toDate && sameName(r.name, trimmedTo));
    const newSwap = {
      id: `${Date.now()}`,
      fromName: fromOwnRows[0]?.name || currentUser,
      fromDate,
      fromSpecialty: fromOwnRows[0]?.specialty || "",
      fromRoles: fromOwnRows.map((r) => r.role),
      toName: toOwnRows[0]?.name || trimmedTo,
      toDate,
      toSpecialty: toOwnRows[0]?.specialty || "",
      toRoles: toOwnRows.map((r) => r.role),
      note: note.trim(),
      status: "pending_colleague",
      submittedAt: new Date().toISOString(),
    };
    setSwaps([...swaps, newSwap]);
    try {
      const nextSwaps = await submitSwapToSheet(newSwap);
      setSwaps(nextSwaps);
    } catch (e) {
      setSyncError(`Couldn't reach Google Sheets — swap request wasn't saved: ${e.message || e}`);
    }
  };

  // The colleague being asked to swap approves or declines first — this
  // doesn't touch the rota yet, it just moves the request on (or ends it)
  // so the coordinator only ever sees requests both people already agreed to.
  const respondSwapAsColleague = async (id, decision) => {
    try {
      const nextStatus = decision === "accepted" ? "pending_coordinator" : "declined_by_colleague";
      const nextSwaps = await setSwapStatusOnSheet(id, nextStatus);
      setSwaps(nextSwaps);
    } catch (e) {
      setSyncError(`Couldn't reach Google Sheets — try again: ${e.message || e}`);
    }
  };

  const respondSwap = async (id, decision) => {
    const swap = swaps.find((s) => s.id === id);
    if (!swap) return;

    try {
      if (decision === "accepted") {
        // Writes the swap into the live Google Sheet and marks this
        // request accepted there too — this is now the source of truth.
        const rows = await pushSwapToSheet(swap.fromDate, swap.fromName, swap.toDate, swap.toName, swap.id);
        const nextRota = { rows, updatedAt: new Date().toISOString() };
        await window.storage.set("rota-data", JSON.stringify(nextRota), true);
        setRota(nextRota);
        const nextSwaps = await fetchSwapsFromSheet();
        setSwaps(nextSwaps);
      } else {
        const nextSwaps = await setSwapStatusOnSheet(id, "declined_by_coordinator");
        setSwaps(nextSwaps);
      }
    } catch (e) {
      setSyncError(`Couldn't reach Google Sheets — try again: ${e.message || e}`);
    }
  };

  // Coordinator-initiated swap between any two people — records it (so it
  // shows in history) and applies it to the rota immediately, skipping the
  // colleague/coordinator approval stages entirely.
  const coordinatorDirectSwap = async (fromDate, fromName, toDate, toName, note) => {
    const fromOwnRows = rota.rows.filter((r) => r.date === fromDate && sameName(r.name, fromName));
    const toOwnRows = rota.rows.filter((r) => r.date === toDate && sameName(r.name, toName));
    const newSwap = {
      id: `${Date.now()}`,
      fromName: fromOwnRows[0]?.name || fromName,
      fromDate,
      fromSpecialty: fromOwnRows[0]?.specialty || "",
      fromRoles: fromOwnRows.map((r) => r.role),
      toName: toOwnRows[0]?.name || toName,
      toDate,
      toSpecialty: toOwnRows[0]?.specialty || "",
      toRoles: toOwnRows.map((r) => r.role),
      note: (note || "").trim() || "Applied directly by coordinator",
      status: "pending_coordinator",
      submittedAt: new Date().toISOString(),
    };
    try {
      await submitSwapToSheet(newSwap);
      const rows = await pushSwapToSheet(newSwap.fromDate, newSwap.fromName, newSwap.toDate, newSwap.toName, newSwap.id);
      const nextRota = { rows, updatedAt: new Date().toISOString() };
      await window.storage.set("rota-data", JSON.stringify(nextRota), true);
      setRota(nextRota);
      const nextSwaps = await fetchSwapsFromSheet();
      setSwaps(nextSwaps);
      return true;
    } catch (e) {
      setSyncError(`Couldn't reach Google Sheets — try again: ${e.message || e}`);
      return false;
    }
  };

  // ---- Excel upload handler ----
  const handleFile = async (file) => {
    setUploadError("");
    setUploading(true);
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array", cellDates: false });
      const rows = parseRotaSheet(wb, rotaYear);

      const payload = { rows, updatedAt: new Date().toISOString() };
      const res = await window.storage.set("rota-data", JSON.stringify(payload), true);
      if (!res) throw new Error("Failed to save the data");
      setRota(payload);

      const approvedLeaves = leaves.filter((l) => l.status === "approved");
      const newConflicts = [];
      approvedLeaves.forEach((l) => {
        rows.forEach((r) => {
          if (
            r.name.toLowerCase().trim() === l.name.toLowerCase().trim() &&
            r.date >= l.startDate &&
            r.date <= l.endDate
          ) {
            newConflicts.push({ name: r.name, date: r.date, specialty: r.specialty, role: r.role, leave: l });
          }
        });
      });
      setUploadConflicts(newConflicts);

      const dirEntries = parseDirectorySheet(wb);
      if (dirEntries.length) {
        const dirPayload = { entries: dirEntries, updatedAt: new Date().toISOString() };
        const dirRes = await window.storage.set("directory-data", JSON.stringify(dirPayload), true);
        if (dirRes) setDirectory(dirPayload);
      }
    } catch (e) {
      setUploadError(e.message || "An error occurred while reading the file");
    } finally {
      setUploading(false);
    }
  };

  return (
    <div
      className="font-body min-h-screen w-full flex justify-center"
      style={{ backgroundColor: C.bg, color: C.text }}
    >
      <style>{FONTS}</style>
      <div className="w-full max-w-md min-h-screen flex flex-col relative" style={{ backgroundColor: C.bg }}>
        {/* Header */}
        <div
          className="sticky top-0 z-20 px-5 pt-5 pb-4"
          style={{ backgroundColor: C.bg }}
        >
          <div className="flex items-center justify-between">
            <div>
              <p className="font-display text-lg font-semibold leading-tight" style={{ color: C.text }}>
                Surgical Rota
              </p>
              <p className="font-mono text-[11px] tracking-wide mt-0.5" style={{ color: C.textMuted }}>
                {new Date().toLocaleDateString("en-GB", {
                  weekday: "long",
                  day: "2-digit",
                  month: "short",
                  year: "numeric",
                })}
              </p>
            </div>
            <button
              onClick={() => setTab("account")}
              className="w-9 h-9 rounded-full flex items-center justify-center"
              style={{ backgroundColor: C.primarySoft }}
            >
              <span>👤</span>
            </button>
          </div>
        </div>

        {/* Content */}
        <div className="flex-1 px-5 pb-28 overflow-y-auto">
          {loading ? (
            <div className="flex justify-center py-16">
              <span>🔄</span>
            </div>
          ) : tab === "today" ? (
            <TodayTab
              rota={rota}
              selectedDate={selectedDate}
              setSelectedDate={setSelectedDate}
              onUpload={handleFile}
              uploading={uploading}
              uploadError={uploadError}
              fileRef={fileRef}
              rotaYear={rotaYear}
              setRotaYear={setRotaYear}
              currentRole={currentRole}
              uploadConflicts={uploadConflicts}
              syncing={syncing}
              syncError={syncError}
              lastSynced={lastSynced}
              syncNow={syncNow}
              morningMeeting={morningMeeting}
            />
          ) : tab === "mine" ? (
            <MineTab
              currentUser={currentUser}
              myRows={myRows}
              onSetTab={setTab}
              rota={rota}
              swaps={swaps}
              allNames={allNames}
              requestSwap={requestSwap}
              respondSwapAsColleague={respondSwapAsColleague}
              morningMeeting={morningMeeting}
            />
          ) : tab === "all" ? (
            <AllTab rota={rota} specialties={specialties} />
          ) : tab === "directory" ? (
            <DirectoryTab directory={directory} />
          ) : tab === "leave" ? (
            <LeaveTab
              currentUser={currentUser}
              currentRole={currentRole}
              leaves={leaves}
              setLeaves={setLeaves}
              specialties={specialties}
              rota={rota}
              swaps={swaps}
              respondSwap={respondSwap}
              coordinatorDirectSwap={coordinatorDirectSwap}
            />
          ) : tab === "dashboard" && currentRole === "coordinator" ? (
            <DashboardTab rota={rota} leaves={leaves} swaps={swaps} specialties={specialties} />
          ) : tab === "account" ? (
            <AccountTab
              currentUser={currentUser}
              currentRole={currentRole}
              nameDraft={nameDraft}
              setNameDraft={setNameDraft}
              roleDraft={roleDraft}
              setRoleDraft={setRoleDraft}
              saveUser={saveUser}
              onBack={() => setTab("today")}
            />
          ) : null}
        </div>

        {/* Bottom nav */}
        <div
          className="fixed bottom-0 w-full max-w-md left-1/2 -translate-x-1/2 px-3 pb-3 pt-2 z-30"
          style={{ backgroundColor: C.bg }}
        >
          <div
            className="flex items-stretch justify-between rounded-2xl px-2 py-2"
            style={{ backgroundColor: C.surface, border: `1px solid ${C.border}` }}
          >
            <NavBtn icon={Stethoscope} label="Today" active={tab === "today"} onClick={() => setTab("today")} />
            <NavBtn icon={CalendarDays} label="My Rota" active={tab === "mine"} onClick={() => setTab("mine")} />
            <NavBtn icon={Users} label="All" active={tab === "all"} onClick={() => setTab("all")} />
            <NavBtn icon={Phone} label="Directory" active={tab === "directory"} onClick={() => setTab("directory")} />
            <NavBtn icon={Plane} label="Leave" active={tab === "leave"} onClick={() => setTab("leave")} />
            {currentRole === "coordinator" && (
              <NavBtn icon={BarChart2} label="Dashboard" active={tab === "dashboard"} onClick={() => setTab("dashboard")} />
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function NavBtn({ icon: Icon, label, active, onClick }) {
  return (
    <button onClick={onClick} className="flex-1 flex flex-col items-center gap-1 py-1.5 rounded-xl">
      <Icon size={18} color={active ? C.primary : C.textMuted} strokeWidth={active ? 2.4 : 2} />
      <span
        className="font-body text-[10px] font-medium"
        style={{ color: active ? C.primary : C.textMuted }}
      >
        {label}
      </span>
    </button>
  );
}

// ---- Today Tab ----
function TodayTab({
  rota,
  selectedDate,
  setSelectedDate,
  onUpload,
  uploading,
  uploadError,
  fileRef,
  rotaYear,
  setRotaYear,
  currentRole,
  uploadConflicts,
  syncing,
  syncError,
  lastSynced,
  syncNow,
  morningMeeting,
}) {
  const isToday = selectedDate === todayISO();

  const todaysPresenters = useMemo(() => {
    const entry = morningMeeting.entries.find((e) => e.date === selectedDate);
    return entry ? entry.presenters : [];
  }, [morningMeeting.entries, selectedDate]);

  const dayRows = useMemo(
    () => rota.rows.filter((r) => r.date === selectedDate),
    [rota.rows, selectedDate]
  );

  const bySpecialty = useMemo(() => {
    const map = {};
    dayRows.forEach((r) => {
      map[r.specialty] = map[r.specialty] || [];
      map[r.specialty].push(r);
    });
    return map;
  }, [dayRows]);

  const shiftDay = (delta) => {
    const d = new Date(selectedDate + "T00:00:00");
    d.setDate(d.getDate() + delta);
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const dd = String(d.getDate()).padStart(2, "0");
    setSelectedDate(`${yyyy}-${mm}-${dd}`);
  };

  return (
    <div className="space-y-4 pt-1">
      <div>
        <div className="flex items-center justify-between mb-2">
          <p className="font-display text-sm font-semibold" style={{ color: C.text }}>
            {isToday ? "Who's on call today" : "Who's on call"}
          </p>
          {!isToday && (
            <button
              onClick={() => setSelectedDate(todayISO())}
              className="font-body text-xs font-medium px-2.5 py-1 rounded-full"
              style={{ backgroundColor: C.primarySoft, color: C.primaryDark }}
            >
              Today
            </button>
          )}
        </div>

        <div
          className="flex items-center gap-2 mb-3 rounded-xl p-1.5"
          style={{ backgroundColor: C.surface, border: `1px solid ${C.border}` }}
        >
          <button
            onClick={() => shiftDay(-1)}
            className="w-8 h-8 shrink-0 rounded-lg flex items-center justify-center"
            style={{ backgroundColor: C.surfaceMuted }}
          >
            <span>‹</span>
          </button>
          <div className="flex-1 relative flex items-center justify-center gap-2">
            <span className="font-mono text-sm font-semibold" style={{ color: C.text }}>
              {formatDatePretty(selectedDate)}
            </span>
            <input
              type="date"
              value={selectedDate}
              onChange={(e) => e.target.value && setSelectedDate(e.target.value)}
              className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
              aria-label="Pick a date"
            />
          </div>
          <button
            onClick={() => shiftDay(1)}
            className="w-8 h-8 shrink-0 rounded-lg flex items-center justify-center"
            style={{ backgroundColor: C.surfaceMuted }}
          >
            <span>›</span>
          </button>
        </div>

        {dayRows.length === 0 ? (
          <Card>
            <EmptyState
              icon={Stethoscope}
              title="No data for this date"
              subtitle={rota.rows.length ? "Try a different date, or check the rota covers this period" : "Upload the rota file first"}
            />
          </Card>
        ) : (
          <div className="space-y-2.5">
            {Object.entries(bySpecialty).map(([spec, people]) => {
              const sc = specialtyColor(spec);
              return (
                <Card key={spec} style={{ borderColor: C.border, borderLeft: `4px solid ${sc.text}` }}>
                  <div className="flex items-center justify-between mb-2">
                    <span
                      className="font-body text-[11px] font-semibold tracking-wide uppercase px-1.5 py-0.5 rounded"
                      style={{ color: sc.text, backgroundColor: sc.bg }}
                    >
                      {spec}
                    </span>
                    <span className="w-1.5 h-1.5 rounded-full" style={{ backgroundColor: C.amber }} />
                  </div>
                  <div className="space-y-2">
                    {people.map((p, i) => (
                      <PersonBadge key={i} name={p.name} specialty={spec} role={p.role} />
                    ))}
                  </div>
                </Card>
              );
            })}
          </div>
        )}
      </div>

      {todaysPresenters.length > 0 && (() => {
        const mmColor = specialtyColor("Morning Meeting");
        return (
          <Card style={{ borderColor: C.border, borderLeft: `4px solid ${mmColor.text}` }}>
            <div className="flex items-center justify-between mb-2">
              <span
                className="font-body text-[11px] font-semibold tracking-wide uppercase px-1.5 py-0.5 rounded"
                style={{ color: mmColor.text, backgroundColor: mmColor.bg }}
              >
                Morning Meeting
              </span>
            </div>
            <div className="space-y-2">
              {todaysPresenters.map((name, i) => (
                <div
                  key={i}
                  className="flex items-center gap-2 rounded-lg px-3 py-2"
                  style={{ backgroundColor: mmColor.bg }}
                >
                  <span className="font-mono text-xs font-semibold shrink-0" style={{ color: mmColor.text }}>
                    {i + 1}.
                  </span>
                  <span className="font-body text-sm font-medium" style={{ color: mmColor.text }}>
                    {name}
                  </span>
                </div>
              ))}
            </div>
          </Card>
        );
      })()}

      <Card className="flex items-center justify-between gap-2">
        <div className="flex items-center gap-2 min-w-0">
          <span
            className="w-1.5 h-1.5 rounded-full shrink-0"
            style={{ backgroundColor: syncError ? C.danger : C.success }}
          />
          <div className="min-w-0">
            <p className="font-body text-xs font-medium" style={{ color: C.text }}>
              {syncing ? "Syncing with Google Sheets…" : syncError ? "Sync failed" : "Synced with Google Sheets"}
            </p>
            {lastSynced && !syncing && (
              <p className="font-body text-[11px]" style={{ color: C.textMuted }}>
                Last synced {lastSynced.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}
              </p>
            )}
            {syncError && (
              <p className="font-body text-[11px]" style={{ color: C.danger }}>
                {syncError}
              </p>
            )}
          </div>
        </div>
        <button
          onClick={() => syncNow({ fullRefresh: true })}
          disabled={syncing}
          className="font-body text-[11px] font-medium px-2.5 py-1.5 rounded-full shrink-0"
          style={{ backgroundColor: C.primarySoft, color: C.primaryDark }}
        >
          {syncing ? "…" : "Sync now"}
        </button>
      </Card>

      {currentRole === "coordinator" ? (
        <>
          <UploadCard
            onUpload={onUpload}
            uploading={uploading}
            uploadError={uploadError}
            fileRef={fileRef}
            rota={rota}
            rotaYear={rotaYear}
            setRotaYear={setRotaYear}
          />
          {uploadConflicts.length > 0 && (
            <Card style={{ backgroundColor: C.amberSoft, border: `1px solid ${C.amber}` }}>
              <div className="flex items-center gap-2 mb-2">
                <span>⚠️</span>
                <p className="font-body text-sm font-semibold" style={{ color: C.amber }}>
                  {uploadConflicts.length} rota entr{uploadConflicts.length === 1 ? "y" : "ies"} clash with approved leave
                </p>
              </div>
              <div className="space-y-1.5">
                {uploadConflicts.map((c, i) => (
                  <p key={i} className="font-body text-[11px]" style={{ color: C.amber }}>
                    {c.name} · {formatDatePretty(c.date)} · {c.specialty} ({c.role}) — on approved leave{" "}
                    {formatDatePretty(c.leave.startDate)}–{formatDatePretty(c.leave.endDate)}
                  </p>
                ))}
              </div>
            </Card>
          )}
        </>
      ) : (
        rota.updatedAt && (
          <Card className="flex items-center gap-2">
            <span>🔒</span>
            <p className="font-body text-[11px]" style={{ color: C.textMuted }}>
              Rota last updated {new Date(rota.updatedAt).toLocaleString("en-GB")} · only the coordinator can update it
            </p>
          </Card>
        )
      )}
    </div>
  );
}

function UploadCard({ onUpload, uploading, uploadError, fileRef, rota, rotaYear, setRotaYear }) {
  return (
    <Card>
      <div className="flex items-center gap-2 mb-2">
        <span>📎</span>
        <p className="font-body text-sm font-semibold" style={{ color: C.text }}>
          Manual Excel update (fallback)
        </p>
      </div>
      <p className="font-body text-xs mb-3" style={{ color: C.textMuted }}>
        The rota now syncs live from Google Sheets. Use this only if the sheet sync is down — it overwrites the rota locally until the next sync.
      </p>
      <Field label="Rota year" className="mb-3">
        <input
          type="number"
          value={rotaYear}
          onChange={(e) => setRotaYear(parseInt(e.target.value, 10) || new Date().getFullYear())}
          className="w-full font-mono text-sm px-3 py-2 rounded-lg outline-none"
          style={{ border: `1px solid ${C.border}`, color: C.text }}
        />
        <p className="font-body text-[11px] mt-1" style={{ color: C.textMuted }}>
          The sheet only has day numbers, so we need the year to build real dates.
        </p>
      </Field>
      <input
        ref={fileRef}
        type="file"
        accept=".xlsx,.xls,.csv"
        className="hidden"
        onChange={(e) => {
          const f = e.target.files?.[0];
          if (f) onUpload(f);
          e.target.value = "";
        }}
      />
      <button
        onClick={() => fileRef.current?.click()}
        disabled={uploading}
        className="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl font-body text-sm font-medium"
        style={{ backgroundColor: C.primary, color: "white" }}
      >
        {uploading ? <span>🔄</span> : <span>📤</span>}
        {uploading ? "Reading..." : "Upload rota file"}
      </button>
      {uploadError && (
        <div className="flex items-start gap-1.5 mt-2.5">
          <span>⚠️</span>
          <p className="font-body text-xs" style={{ color: C.danger }}>
            {uploadError}
          </p>
        </div>
      )}
      {rota.updatedAt && (
        <p className="font-mono text-[10px] mt-2.5" style={{ color: C.textMuted }}>
          Last updated: {new Date(rota.updatedAt).toLocaleString("en-GB")}
        </p>
      )}
    </Card>
  );
}

// ---- Mine Tab ----
function MineTab({ currentUser, myRows, onSetTab, rota, swaps, allNames, requestSwap, respondSwapAsColleague, morningMeeting }) {
  const myPresentations = useMemo(() => {
    return morningMeeting.entries
      .filter((e) => e.date >= todayISO() && e.presenters.some((p) => sameName(p, currentUser)))
      .sort((a, b) => a.date.localeCompare(b.date));
  }, [morningMeeting.entries, currentUser]);

  const [openFor, setOpenFor] = useState(null); // index of myRows with swap form open
  const [colleague, setColleague] = useState("");
  const [colleagueEntry, setColleagueEntry] = useState(""); // JSON string of the chosen entry
  const [note, setNote] = useState("");
  const [respondingId, setRespondingId] = useState(null);

  const colleagueRows = useMemo(() => {
    if (!colleague) return [];
    const rows = rota.rows.filter((r) => sameName(r.name, colleague) && r.date >= todayISO());
    return collapseByDay(rows).sort((a, b) => a.date.localeCompare(b.date));
  }, [rota.rows, colleague]);

  const outgoing = swaps.filter((s) => sameName(s.fromName, currentUser));
  const incoming = swaps.filter((s) => sameName(s.toName, currentUser) && s.status === "pending_colleague");

  // A day is identified by its Emergency-coverage role, even if the
  // person has other roles (e.g. Wards) that same day — the whole day
  // travels together when swapped.
  const displayRows = useMemo(() => collapseByDay(myRows).sort((a, b) => a.date.localeCompare(b.date)), [myRows]);

  if (!currentUser) {
    return (
      <Card>
        <EmptyState icon={UserRound} title="Set your name first" subtitle="So we can show your personal calls" />
        <button
          onClick={() => onSetTab("account")}
          className="w-full mt-1 py-2.5 rounded-xl font-body text-sm font-medium"
          style={{ backgroundColor: C.primary, color: "white" }}
        >
          Enter name
        </button>
      </Card>
    );
  }

  const addToCalendar = () => {
    if (!myRows.length) return;
    const ics = buildICS(myRows);
    const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    window.location.href = url;
  };

  const openSwapForm = (i) => {
    setOpenFor(openFor === i ? null : i);
    setColleague("");
    setColleagueEntry("");
    setNote("");
  };

  const submitSwap = (entry) => {
    if (!colleague.trim() || !colleagueEntry) return;
    requestSwap(entry.date, colleague, colleagueEntry, note);
    setOpenFor(null);
    setColleague("");
    setColleagueEntry("");
    setNote("");
  };

  return (
    <div className="space-y-4 pt-1">
      {myPresentations.length > 0 && (() => {
        const mmColor = specialtyColor("Morning Meeting");
        return (
          <Card style={{ borderColor: C.border, borderLeft: `4px solid ${mmColor.text}` }}>
            <span
              className="font-body text-[11px] font-semibold tracking-wide uppercase px-1.5 py-0.5 rounded"
              style={{ color: mmColor.text, backgroundColor: mmColor.bg }}
            >
              Morning Meeting
            </span>
            <div className="space-y-1 mt-2">
              {myPresentations.map((e, i) => (
                <p key={i} className="font-body text-sm" style={{ color: C.text }}>
                  You're presenting on <span className="font-mono font-semibold">{formatDatePretty(e.date)}</span>
                </p>
              ))}
            </div>
          </Card>
        );
      })()}

      <div className="flex items-center justify-between gap-2">
        <p className="font-display text-sm font-semibold" style={{ color: C.text }}>
          My upcoming calls — {currentUser}
        </p>
        {myRows.length > 0 && (
          <button
            onClick={addToCalendar}
            className="font-body text-[11px] font-medium px-2.5 py-1.5 rounded-full shrink-0"
            style={{ backgroundColor: C.primarySoft, color: C.primaryDark }}
          >
            Add all to Calendar
          </button>
        )}
      </div>

      {myRows.length === 0 ? (
        <Card>
          <EmptyState icon={CalendarDays} title="You have no upcoming calls on record" />
        </Card>
      ) : (
        <div className="space-y-2">
          {displayRows.map((r, i) => {
            const isToday = r.date === todayISO();
            const sc = specialtyColor(r.specialty);
            const isOpen = openFor === i;
            const companions = getRotaCompanions(rota.rows, r);
            return (
              <Card key={i} style={isToday ? { borderColor: C.amber, borderLeft: `4px solid ${sc.text}` } : { borderLeft: `4px solid ${sc.text}` }}>
                <div className="flex items-center justify-between">
                  <div>
                    <p className="font-mono text-xs font-semibold" style={{ color: isToday ? C.amber : C.textMuted }}>
                      {formatDatePretty(r.date)}
                    </p>
                    <p className="font-body text-sm font-medium mt-0.5" style={{ color: sc.text }}>
                      {r.specialty}
                    </p>
                  </div>
                  <Pill tone={isToday ? "amber" : "muted"}>{r.role}</Pill>
                </div>
                {companions && (
                  <div className="mt-1.5 space-y-0.5">
                    {companions.teamLeader && (
                      <p className="font-body text-[11px]" style={{ color: C.textMuted }}>
                        Team Leader: <span style={{ fontWeight: 600, color: C.text }}>{companions.teamLeader.name}</span>
                      </p>
                    )}
                    {companions.consultants && (
                      <p className="font-body text-[11px]" style={{ color: C.textMuted }}>
                        Consultant on call: <span style={{ fontWeight: 600, color: C.text }}>{companions.consultants.join(", ")}</span>
                      </p>
                    )}
                    {companions.seniorsByPeriod && (
                      <p className="font-body text-[11px]" style={{ color: C.textMuted }}>
                        Seniors: <span style={{ fontWeight: 600, color: C.text }}>{companions.seniorsByPeriod.join(" · ")}</span>
                      </p>
                    )}
                  </div>
                )}
                <button
                  onClick={() => openSwapForm(i)}
                  className="font-body text-[11px] font-medium mt-2"
                  style={{ color: C.primary }}
                >
                  {isOpen ? "Cancel" : "Request swap"}
                </button>
                {isOpen && (
                  <div className="mt-2 space-y-2 pt-2" style={{ borderTop: `1px solid ${C.border}` }}>
                    <input
                      list="mine-all-names"
                      value={colleague}
                      onChange={(e) => {
                        setColleague(e.target.value);
                        setColleagueEntry("");
                      }}
                      placeholder="Swap with (colleague's name)"
                      className="w-full font-body text-sm px-3 py-2 rounded-lg outline-none"
                      style={{ border: `1px solid ${C.border}`, color: C.text }}
                    />
                    <datalist id="mine-all-names">
                      {allNames.map((n) => (
                        <option key={n} value={n} />
                      ))}
                    </datalist>

                    {colleague && (
                      <select
                        value={colleagueEntry}
                        onChange={(e) => setColleagueEntry(e.target.value)}
                        className="w-full font-body text-sm px-3 py-2 rounded-lg outline-none"
                        style={{ border: `1px solid ${C.border}`, color: C.text, backgroundColor: C.surface }}
                      >
                        <option value="">
                          {colleagueRows.length ? "Pick their day to swap with" : "No upcoming calls found for this name"}
                        </option>
                        {colleagueRows.map((cr, idx) => (
                          <option key={idx} value={cr.date}>
                            {formatDatePretty(cr.date)} · {cr.specialty} · {cr.role}
                          </option>
                        ))}
                      </select>
                    )}

                    <input
                      value={note}
                      onChange={(e) => setNote(e.target.value)}
                      placeholder="Note (optional)"
                      className="w-full font-body text-sm px-3 py-2 rounded-lg outline-none"
                      style={{ border: `1px solid ${C.border}`, color: C.text }}
                    />
                    <button
                      onClick={() => submitSwap(r)}
                      disabled={!colleague.trim() || !colleagueEntry}
                      className="w-full py-2 rounded-lg font-body text-xs font-medium"
                      style={{ backgroundColor: C.primary, color: "white", opacity: !colleague.trim() || !colleagueEntry ? 0.5 : 1 }}
                    >
                      Send swap request
                    </button>
                    <p className="font-body text-[11px]" style={{ color: C.textMuted }}>
                      {colleague.trim() || "Your colleague"} needs to approve first, then the coordinator gives final approval — the rota updates automatically once both do.
                    </p>
                  </div>
                )}
              </Card>
            );
          })}
        </div>
      )}

      {incoming.length > 0 && (
        <div className="space-y-2">
          <p className="font-body text-xs font-semibold" style={{ color: C.amber }}>
            Swap requests for you
          </p>
          {incoming.map((s) => (
            <Card key={s.id}>
              <p className="font-body text-sm" style={{ color: C.text }}>
                <span className="font-medium">{s.fromName}</span> wants to swap with you
              </p>
              <p className="font-mono text-[11px] mt-1" style={{ color: C.textMuted }}>
                They give: {formatDatePretty(s.fromDate)} · {s.fromSpecialty ? `${s.fromSpecialty} · ` : ""}{(s.fromRoles || []).join(", ") || "—"}
              </p>
              <p className="font-mono text-[11px]" style={{ color: C.textMuted }}>
                You give: {formatDatePretty(s.toDate)} · {s.toSpecialty ? `${s.toSpecialty} · ` : ""}{(s.toRoles || []).join(", ") || "—"}
              </p>
              {s.note && (
                <p className="font-body text-xs mt-1 italic" style={{ color: C.textMuted }}>
                  "{s.note}"
                </p>
              )}
              <div className="flex gap-2 mt-3">
                <button
                  onClick={async () => {
                    setRespondingId(s.id);
                    await respondSwapAsColleague(s.id, "accepted");
                    setRespondingId(null);

                  disabled={respondingId === s.id}
                  className="flex-1 flex items-center justify-center gap-1 py-1.5 rounded-lg font-body text-xs font-medium"
                  style={{ backgroundColor: C.successSoft, color: C.success, opacity: respondingId === s.id ? 0.6 : 1 }}
                >

                </button>

                  onClick={async () => {
                    setRespondingId(s.id);
                    await respondSwapAsColleague(s.id, "declined");
                    setRespondingId(null);
                  }}
                  disabled={respondingId === s.id}
                  className="flex-1 flex items-center justify-center gap-1 py-1.5 rounded-lg font-body text-xs font-medium"
                  style={{ backgroundColor: C.dangerSoft, color: C.danger, opacity: respondingId === s.id ? 0.6 : 1 }}

      {outgoing.length > 0 && (
        <div className="space-y-2">

              accepted: "success",
              declined_by_colleague: "danger",

            const labelMap = {
              pending_colleague: "Waiting on colleague",
              pending_coordinator: "Waiting on coordinator",
              accepted: "Approved",
              declined_by_colleague: "Declined by colleague",

            return (

                <div className="flex items-center justify-between">

                <p className="font-mono text-[11px] mt-1" style={{ color: C.textMuted }}>

                </p>
                <p className="font-mono text-[11px]" style={{ color: C.textMuted }}>
                  You get: {formatDatePretty(s.toDate)} · {s.toSpecialty ? `${s.toSpecialty} · ` : ""}{(s.toRoles || []).join(", ") || "—"}
                </p>
              </Card>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ---- All Tab ----


function AllTab({ rota, specialties }) {
  const [filter, setFilter] = useState("all");
  const [view, setView] = useState("list");
  const [selectedPerson, setSelectedPerson] = useState(null);
  const [selectedMonth, setSelectedMonth] = useState(null);

  const filteredAll = useMemo(() => {
    return filter === "all" ? rota.rows : rota.rows.filter((r) => r.specialty === filter);
  }, [rota.rows, filter]);

  const availableMonths = useMemo(() => {
    const set = new Set(rota.rows.map((r) => r.date.slice(0, 7)));
    return Array.from(set).sort();
  }, [rota.rows]);

  // Default to the current month if the rota has it, otherwise the most
  // recent month available — but only set this once, so it doesn't
  // override a choice the person already made.
  useEffect(() => {
    if (selectedMonth === null && availableMonths.length) {
      const thisMonth = todayISO().slice(0, 7);
      setSelectedMonth(availableMonths.includes(thisMonth) ? thisMonth : availableMonths[availableMonths.length - 1]);
    }
  }, [availableMonths, selectedMonth]);

  const workloadRows = useMemo(() => {
    if (!selectedMonth || selectedMonth === "all") return filteredAll;
    return filteredAll.filter((r) => r.date.startsWith(selectedMonth));
  }, [filteredAll, selectedMonth]);

  const rows = useMemo(() => {
    const upcoming = filteredAll.filter((r) => r.date >= todayISO());
    return upcoming.slice().sort((a, b) => a.date.localeCompare(b.date));
  }, [filteredAll]);

  const workload = useMemo(() => {
    const byDateName = {};
    workloadRows.forEach((r) => {
      const key = `${r.date}|${r.name}`;
      if (!byDateName[key]) {
        byDateName[key] = { name: r.name, other: 0, otherMorning: 0, juniorMorning: 0, isJunior: false, hasEmergency: false };
      }
      const entry = byDateName[key];
      const roleLower = r.role.trim().toLowerCase();
      const isJuniorRole = r.specialty.toLowerCase().includes("junior");
      if (roleLower === "morning") {
        // Morning only counts as an *extra* call for Juniors. For every
        // other specialty it's just a normal role for the day — it
        // shouldn't inflate the count on top of another call that day.
        if (isJuniorRole) entry.juniorMorning += 1;
        else entry.otherMorning += 1;
        return;
      }
      if (isJuniorRole) {
        entry.isJunior = true;
        if (roleLower.includes("emergency")) entry.hasEmergency = true;
        // Wards / Theatre / OT for Juniors don't count as a call on their own.
      } else {
        entry.other += 1;
      }
    });
    const counts = {};
    Object.values(byDateName).forEach(({ name, other, otherMorning, juniorMorning, isJunior, hasEmergency }) => {
      const dayCount = juniorMorning + (isJunior ? (hasEmergency ? 1 : 0) : other > 0 || otherMorning > 0 ? 1 : 0);
      counts[name] = (counts[name] || 0) + dayCount;
    });
    const list = Object.entries(counts).map(([name, count]) => ({ name, count }));
    list.sort((a, b) => b.count - a.count);
    return list;
  }, [workloadRows]);

  const maxCount = workload.length ? workload[0].count : 1;

  // Respects whatever month/specialty is currently selected in Workload,
  // so the detail view matches what you just tapped into — not everything
  // that person has ever done across every month and specialty.
  const personRows = useMemo(() => {
    if (!selectedPerson) return [];
    return workloadRows
      .filter((r) => r.name === selectedPerson)
      .slice()
      .sort((a, b) => a.date.localeCompare(b.date));
  }, [workloadRows, selectedPerson]);

  // Grouped by specialty so a person covering more than one specialty
  // (e.g. a Senior also covering Vascular) shows each one clearly on its
  // own, instead of mixed into one flat list.
  const personRowsBySpecialty = useMemo(() => {
    const groups = {};
    personRows.forEach((r) => {
      if (!groups[r.specialty]) groups[r.specialty] = [];
      groups[r.specialty].push(r);
    });
    return Object.entries(groups);
  }, [personRows]);

  return (
    <div className="space-y-4 pt-1">
      <div className="flex items-center justify-between">
        <p className="font-display text-sm font-semibold" style={{ color: C.text }}>
          Full Rota
        </p>
        <div className="flex rounded-full p-0.5" style={{ backgroundColor: C.surfaceMuted }}>
          <button
            onClick={() => setView("list")}
            className="px-2.5 py-1 rounded-full font-body text-[11px] font-medium"
            style={{ backgroundColor: view === "list" ? C.surface : "transparent", color: view === "list" ? C.text : C.textMuted }}
          >
            List
          </button>
          <button
            onClick={() => setView("workload")}
            className="px-2.5 py-1 rounded-full font-body text-[11px] font-medium flex items-center gap-1"
            style={{ backgroundColor: view === "workload" ? C.surface : "transparent", color: view === "workload" ? C.text : C.textMuted }}
          >
            <span>📊</span> Workload
          </button>
        </div>
      </div>

      {specialties.length > 0 && (
        <div className="flex gap-1.5 overflow-x-auto pb-1 -mx-1 px-1">
          <FilterChip label="All" active={filter === "all"} onClick={() => setFilter("all")} />
          {specialties.map((s) => (
            <FilterChip key={s} label={s} active={filter === s} onClick={() => setFilter(s)} />
          ))}
        </div>
      )}

      {view === "workload" && availableMonths.length > 0 && (
        <div>
          <p className="font-body text-[11px] font-semibold tracking-wide uppercase mb-1.5" style={{ color: C.textMuted }}>
            Month
          </p>
          <div className="flex gap-1.5 overflow-x-auto pb-1 -mx-1 px-1">
            {availableMonths.map((ym) => (
              <FilterChip
                key={ym}
                label={formatMonthLabel(ym)}
                active={selectedMonth === ym}
                onClick={() => setSelectedMonth(ym)}
              />
            ))}
            {availableMonths.length > 1 && (
              <FilterChip label="All months" active={selectedMonth === "all"} onClick={() => setSelectedMonth("all")} />
            )}
          </div>
        </div>
      )}

      {view === "workload" ? (
        selectedPerson ? (
          <div className="space-y-2">
            <button
              onClick={() => setSelectedPerson(null)}
              className="font-body text-xs font-medium flex items-center gap-1"
              style={{ color: C.primary }}
            >
              <span style={{ fontSize: 13 }}>{"\u2039"}</span> Back to workload
            </button>
            <p className="font-body text-sm font-semibold" style={{ color: C.text }}>
              {selectedPerson}
            </p>
            <p className="font-body text-[11px]" style={{ color: C.textMuted }}>
              {filter !== "all" ? filter : "All specialties"} · {selectedMonth && selectedMonth !== "all" ? formatMonthLabel(selectedMonth) : "All months"}
            </p>
            {personRows.length === 0 ? (
              <Card>
                <EmptyState icon={CalendarDays} title="No calls found for this person" />
              </Card>
            ) : (
              personRowsBySpecialty.map(([specialty, entries]) => {
                const sc = specialtyColor(specialty);
                return (
                  <div key={specialty} className="space-y-2">
                    <p
                      className="font-body text-[11px] font-semibold tracking-wide uppercase px-1.5 py-0.5 rounded inline-block"
                      style={{ color: sc.text, backgroundColor: sc.bg }}
                    >
                      {specialty}
                    </p>
                    {entries.map((r, i) => (
                      <Card key={i} className="flex items-center gap-3" style={{ borderLeft: `4px solid ${sc.text}` }}>
                        <p className="font-mono text-xs font-semibold shrink-0" style={{ color: C.textMuted }}>
                          {formatDatePretty(r.date)}
                        </p>
                        <div className="flex-1 min-w-0">
                          <PersonBadge name={selectedPerson} specialty={r.specialty} role={r.role} />
                        </div>
                      </Card>
                    ))}
                  </div>
                );
              })
            )}
          </div>
        ) : workload.length === 0 ? (
          <Card>

// ---- PDF export (Coordinator Dashboard) ----
// Colors mirror the app's own palette (C.primary etc.) as 0-255 RGB triples,
// since jsPDF doesn't accept hex strings directly.
const PDF_COLORS = {
  primary: [15, 107, 92],
  amber: [180, 83, 9],
  text: [16, 36, 46],
  muted: [91, 110, 107],
  rowAlt: [243, 247, 246],
  white: [255, 255, 255],
};

function drawPdfFooter(doc, pageNum) {
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  doc.setFontSize(8);
  doc.setTextColor(...PDF_COLORS.muted);
  doc.text("Surgical Rota App", 14, pageHeight - 8);
  doc.text(`Page ${pageNum}`, pageWidth - 24, pageHeight - 8);
}

function drawPdfHeader(doc, title, subtitle) {
  const pageWidth = doc.internal.pageSize.getWidth();
  doc.setFillColor(...PDF_COLORS.primary);
  doc.rect(0, 0, pageWidth, 28, "F");
  doc.setTextColor(...PDF_COLORS.white);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(16);
  doc.text("Surgical Rota", 14, 12);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(11);
  doc.text(title, 14, 20);
  if (subtitle) {
    doc.setFontSize(9);
    doc.text(subtitle, 14, 25.5);
  }
  const generatedLine = `Generated ${new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" })}`;
  doc.setFontSize(8.5);
  doc.text(generatedLine, pageWidth - 55, 12);
  return 36;
}

// Draws a simple, styled table starting at startY, paginating (with a
// repeated header row + footer) whenever content runs off the page.
function drawPdfTable(doc, { columns, rows, startY, title }) {
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const marginX = 14;
  const rowHeight = 8;
  const headerHeight = 9;
  let y = startY;
  let pageNum = 1;

  if (title) {
    doc.setTextColor(...PDF_COLORS.text);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);
    doc.text(title, marginX, y);
    y += 7;
  }

  function drawColumnHeaders(yPos) {
    doc.setFillColor(...PDF_COLORS.primary);
    doc.rect(marginX, yPos, pageWidth - marginX * 2, headerHeight, "F");
    doc.setTextColor(...PDF_COLORS.white);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9);
    let x = marginX + 2;
    columns.forEach((col) => {
      doc.text(col.header, x, yPos + 6);
      x += col.width;
    });
    return yPos + headerHeight;
  }

  y = drawColumnHeaders(y);

  rows.forEach((row, i) => {
    if (y + rowHeight > pageHeight - 16) {
      drawPdfFooter(doc, pageNum);
      doc.addPage();
      pageNum += 1;
      y = 16;
      y = drawColumnHeaders(y);
    }
    if (i % 2 === 1) {
      doc.setFillColor(...PDF_COLORS.rowAlt);
      doc.rect(marginX, y, pageWidth - marginX * 2, rowHeight, "F");
    }
    doc.setTextColor(...PDF_COLORS.text);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8.5);
    let x = marginX + 2;
    row.forEach((cell, ci) => {
      const text = String(cell == null ? "" : cell);
      const fitted = doc.splitTextToSize(text, columns[ci].width - 3)[0] || "";
      doc.text(fitted, x, y + 5.5);
      x += columns[ci].width;
    });
    y += rowHeight;
  });

  drawPdfFooter(doc, pageNum);
}

function generateDashboardPdf({ reportTitle, filtersText, columns, rows, fileName }) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
  const startY = drawPdfHeader(doc, reportTitle, filtersText);

  if (!rows.length) {
    doc.setTextColor(...PDF_COLORS.muted);
    doc.setFontSize(11);
    doc.text("No data matches the selected filters.", 14, startY + 6);
    drawPdfFooter(doc, 1);
  } else {
    drawPdfTable(doc, { columns, rows, startY });
  }
  doc.save(fileName);
}

// Workload gets two sections: a quick summary (name + total calls), then a
// full detailed breakdown of every date and what each person covered that
// day — on its own page so the summary stays a clean at-a-glance table.
function generateWorkloadPdf({ filtersText, summaryRows, detailRows, fileName }) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
  const startY = drawPdfHeader(doc, "Workload Summary", filtersText);

  if (!summaryRows.length) {
    doc.setTextColor(...PDF_COLORS.muted);
    doc.setFontSize(11);
    doc.text("No data matches the selected filters.", 14, startY + 6);
    drawPdfFooter(doc, 1);
    doc.save(fileName);
    return;
  }

  drawPdfTable(doc, {
    title: "Summary",
    columns: [
      { header: "Name", width: 120 },
      { header: "Calls", width: 40 },
    ],
    rows: summaryRows,
    startY,
  });

  doc.addPage();
  const detailStartY = drawPdfHeader(doc, "Workload Summary — Detailed Coverage", filtersText);
  drawPdfTable(doc, {
    columns: [
      { header: "Name", width: 60 },
      { header: "Date", width: 40 },
      { header: "Specialty", width: 90 },
      { header: "Role", width: 65 },
    ],
    rows: detailRows,
    startY: detailStartY,
  });

  doc.save(fileName);
}

const SWAP_STATUS_LABELS = {
  pending_colleague: "Waiting on colleague",
  pending_coordinator: "Waiting on coordinator",
  accepted: "Approved",
  declined_by_colleague: "Declined by colleague",
  declined_by_coordinator: "Declined by coordinator",
};

function DashboardTab({ rota, leaves, swaps, specialties }) {
  const [reportType, setReportType] = useState("workload"); // "workload" | "swaps" | "leave"
  const [specialtyFilter, setSpecialtyFilter] = useState("all");
  const [monthFilter, setMonthFilter] = useState("all");

  const availableMonths = useMemo(() => {
    const set = new Set(rota.rows.map((r) => r.date.slice(0, 7)));
    return Array.from(set).sort();
  }, [rota.rows]);

  // Leave requests now use the same standard specialty list as the rota
  // (picked from a dropdown, not typed free text), so every report type
  // can safely share the same filter options.
  const specialtyOptions = specialties;

  const workloadRows = useMemo(() => {
    let rows = rota.rows;
    if (specialtyFilter !== "all") rows = rows.filter((r) => r.specialty === specialtyFilter);
    if (monthFilter !== "all") rows = rows.filter((r) => r.date.startsWith(monthFilter));
    return rows;
  }, [rota.rows, specialtyFilter, monthFilter]);

  const workloadData = useMemo(() => {
    const byDateName = {};
    workloadRows.forEach((r) => {
      const key = `${r.date}|${r.name}`;
      if (!byDateName[key]) {
        byDateName[key] = { name: r.name, other: 0, otherMorning: 0, juniorMorning: 0, isJunior: false, hasEmergency: false };
      }
      const entry = byDateName[key];
      const roleLower = r.role.trim().toLowerCase();
      const isJuniorRole = r.specialty.toLowerCase().includes("junior");
      if (roleLower === "morning") {
        if (isJuniorRole) entry.juniorMorning += 1;
        else entry.otherMorning += 1;
        return;
      }
      if (isJuniorRole) {
        entry.isJunior = true;
        if (roleLower.includes("emergency")) entry.hasEmergency = true;
      } else {
        entry.other += 1;
      }
    });
    const counts = {};
    Object.values(byDateName).forEach(({ name, other, otherMorning, juniorMorning, isJunior, hasEmergency }) => {
      const dayCount = juniorMorning + (isJunior ? (hasEmergency ? 1 : 0) : other > 0 || otherMorning > 0 ? 1 : 0);
      counts[name] = (counts[name] || 0) + dayCount;
    });
    return Object.entries(counts)
      .map(([name, count]) => ({ name, count }))
      .sort((a, b) => b.count - a.count);
  }, [workloadRows]);

  // Detailed rows for the PDF — every date and what each person actually
  // covered that day, not just the tally.
  const workloadDetailRows = useMemo(() => {
    return workloadRows
      .slice()
      .sort((a, b) => a.name.localeCompare(b.name) || a.date.localeCompare(b.date))
      .map((r) => [r.name, r.date, r.specialty, r.role]);
  }, [workloadRows]);

  const swapRows = useMemo(() => {
    return swaps
      .filter((s) => specialtyFilter === "all" || s.fromSpecialty === specialtyFilter || s.toSpecialty === specialtyFilter)
      .filter((s) => monthFilter === "all" || (s.fromDate || "").startsWith(monthFilter) || (s.toDate || "").startsWith(monthFilter))
      .slice()
      .sort((a, b) => (a.fromDate || "").localeCompare(b.fromDate || ""));
  }, [swaps, specialtyFilter, monthFilter]);

  const leaveRows = useMemo(() => {
    return leaves
      .filter((l) => specialtyFilter === "all" || (l.specialty || "").trim() === specialtyFilter)
      .filter((l) => monthFilter === "all" || (l.startDate || "").startsWith(monthFilter))
      .slice()
      .sort((a, b) => (a.startDate || "").localeCompare(b.startDate || ""));
  }, [leaves, specialtyFilter, monthFilter]);

  const handleExport = () => {
    const monthLabel = monthFilter === "all" ? "All months" : formatMonthLabel(monthFilter);
    const specLabel = specialtyFilter === "all" ? "All specialties" : specialtyFilter;
    const filtersText = `${specLabel} \u00b7 ${monthLabel}`;

    if (reportType === "workload") {
      generateWorkloadPdf({
        filtersText,
        summaryRows: workloadData.map((w) => [w.name, String(w.count)]),
        detailRows: workloadDetailRows,
        fileName: `workload-${specialtyFilter}-${monthFilter}.pdf`,
      });
    } else if (reportType === "swaps") {
      generateDashboardPdf({
        reportTitle: "Swap Requests",
        filtersText,
        columns: [
          { header: "From", width: 40 },
          { header: "To", width: 40 },
          { header: "Gives (date / role)", width: 65 },
          { header: "Gets (date / role)", width: 65 },
          { header: "Status", width: 35 },
          { header: "Note", width: 45 },
        ],
        rows: swapRows.map((s) => [
          s.fromName,
          s.toName,
          `${s.fromDate} \u00b7 ${(s.fromRoles || []).join(", ")}`,
          `${s.toDate} \u00b7 ${(s.toRoles || []).join(", ")}`,
          SWAP_STATUS_LABELS[s.status] || s.status,
          s.note || "\u2014",
        ]),
        fileName: `swaps-${specialtyFilter}-${monthFilter}.pdf`,
      });
    } else {
      generateDashboardPdf({
        reportTitle: "Leave Requests",
        filtersText,
        columns: [
          { header: "Name", width: 55 },
          { header: "Specialty", width: 55 },
          { header: "Type", width: 35 },
          { header: "From", width: 35 },
          { header: "To", width: 35 },
          { header: "Status", width: 35 },
        ],
        rows: leaveRows.map((l) => [l.name, l.specialty || "\u2014", l.type, l.startDate, l.endDate, l.status]),
        fileName: `leave-${specialtyFilter}-${monthFilter}.pdf`,
      });
    }
  };

  return (
    <div className="space-y-4 pt-1">
      <p className="font-display text-sm font-semibold" style={{ color: C.text }}>
        Coordinator Dashboard
      </p>

      <div className="flex gap-1.5">
        <FilterChip label="Workload" active={reportType === "workload"} onClick={() => setReportType("workload")} />
        <FilterChip label="Swaps" active={reportType === "swaps"} onClick={() => setReportType("swaps")} />
        <FilterChip label="Leave" active={reportType === "leave"} onClick={() => setReportType("leave")} />
      </div>

      <div>
        <p className="font-body text-[11px] font-semibold tracking-wide uppercase mb-1.5" style={{ color: C.textMuted }}>
          Specialty
        </p>
        <div className="flex gap-1.5 overflow-x-auto pb-1 -mx-1 px-1">
          <FilterChip label="All" active={specialtyFilter === "all"} onClick={() => setSpecialtyFilter("all")} />
          {specialtyOptions.map((s) => (
            <FilterChip key={s} label={s} active={specialtyFilter === s} onClick={() => setSpecialtyFilter(s)} />
          ))}
        </div>
      </div>

      {availableMonths.length > 0 && (
        <div>
          <p className="font-body text-[11px] font-semibold tracking-wide uppercase mb-1.5" style={{ color: C.textMuted }}>
            Month
          </p>
          <div className="flex gap-1.5 overflow-x-auto pb-1 -mx-1 px-1">
            <FilterChip label="All months" active={monthFilter === "all"} onClick={() => setMonthFilter("all")} />
            {availableMonths.map((ym) => (
              <FilterChip key={ym} label={formatMonthLabel(ym)} active={monthFilter === ym} onClick={() => setMonthFilter(ym)} />
            ))}
          </div>
        </div>
      )}

      <Card>
        {reportType === "workload" && (
          <>
            <p className="font-body text-xs font-semibold mb-2" style={{ color: C.textMuted }}>
              {workloadData.length} {workloadData.length === 1 ? "person" : "people"}
            </p>
            <div className="space-y-2 max-h-64 overflow-y-auto">
              {workloadData.map((w) => (
                <div key={w.name} className="flex items-center justify-between">
                  <span className="font-body text-sm" style={{ color: C.text }}>
                    {w.name}
                  </span>
                  <span className="font-mono text-xs" style={{ color: C.textMuted }}>
                    {w.count}
                  </span>
                </div>
              ))}
              {!workloadData.length && <EmptyState icon={BarChart2} title="No data for these filters" />}
            </div>
          </>
        )}
        {reportType === "swaps" && (
          <>
            <p className="font-body text-xs font-semibold mb-2" style={{ color: C.textMuted }}>
              {swapRows.length} swap {swapRows.length === 1 ? "request" : "requests"}
            </p>
            <div className="space-y-2 max-h-64 overflow-y-auto">
              {swapRows.map((s) => (
                <div key={s.id} className="pb-2 border-b" style={{ borderColor: C.border }}>
                  <p className="font-body text-sm font-medium" style={{ color: C.text }}>
                    {s.fromName} ⇄ {s.toName}
                  </p>
                  <p className="font-mono text-[11px]" style={{ color: C.textMuted }}>
                    {s.fromDate} → {s.toDate} · {SWAP_STATUS_LABELS[s.status] || s.status}
                  </p>
                </div>
              ))}
              {!swapRows.length && <EmptyState icon={RefreshCw} title="No swaps for these filters" />}
            </div>
          </>
        )}
        {reportType === "leave" && (
          <>
            <p className="font-body text-xs font-semibold mb-2" style={{ color: C.textMuted }}>
              {leaveRows.length} leave {leaveRows.length === 1 ? "request" : "requests"}
            </p>
            <div className="space-y-2 max-h-64 overflow-y-auto">
              {leaveRows.map((l) => (
                <div key={l.id} className="pb-2 border-b" style={{ borderColor: C.border }}>
                  <p className="font-body text-sm font-medium" style={{ color: C.text }}>
                    {l.name}
                  </p>
                  <p className="font-mono text-[11px]" style={{ color: C.textMuted }}>
                    {l.startDate} → {l.endDate} · {l.type} · {l.status}
                  </p>
                </div>
              ))}
              {!leaveRows.length && <EmptyState icon={Plane} title="No leave requests for these filters" />}
            </div>
          </>
        )}
      </Card>

      <button
        onClick={handleExport}
        className="w-full py-3 rounded-xl font-body text-sm font-semibold flex items-center justify-center gap-2"
        style={{ backgroundColor: C.primary, color: "white" }}
      >
        <span>📎</span> Export PDF
      </button>
    </div>
  );
}
