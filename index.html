    const specialtyRowIdx = grid.findIndex((row) => String(row[0] || "").trim().toUpperCase() === "DATE");

            endCol = c;
            break;

    let currentSpecialty = "";
    let currentSub = "";
    for (let c = 2; c < endCol; c++) {
        const specVal = String(specialtyRow[c] || "").trim();
        if (specVal) {
            currentSpecialty = specVal.replace(/\s+/g, " ");
            currentSub = "";
        }
        const subValOwn = String(subGroupRow[c] || "").trim();
        if (subValOwn)
            currentSub = subValOwn;
        const roleValOwn = String(roleRow[c] || "").trim();
        if (!currentSpecialty)
            continue;

        if (roleValOwn) {
            // Leaf role, e.g. "Emergency"/"Wards" under a subgroup like "Early"
            role = currentSub ? `${currentSub} ${roleValOwn}` : roleValOwn;
        }
        else if (subValOwn) {
            // Standalone role with no further split, e.g. "Morning", "24 HR OT"
            role = subValOwn;
        }

        throw new Error("Couldn't map any role columns under the specialty headers");

// Draws a simple, styled table starting at startY, paginating (with a
// repeated header row + footer) whenever content runs off the page.
function drawPdfTable(doc, { columns, rows, startY, title }) {
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const marginX = 14;
    const rowHeight = 8;
    const headerHeight = 9;
    let y = startY;
    let pageNum = 1;
    if (title) {
        doc.setTextColor(...PDF_COLORS.text);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(11);
        doc.text(title, marginX, y);
        y += 7;
    }
    function drawColumnHeaders(yPos) {
        doc.setFillColor(...PDF_COLORS.primary);
        doc.rect(marginX, yPos, pageWidth - marginX * 2, headerHeight, "F");
        doc.setTextColor(...PDF_COLORS.white);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(9);
        let x = marginX + 2;
        columns.forEach((col) => {
            doc.text(col.header, x, yPos + 6);
            x += col.width;
        });
        return yPos + headerHeight;
    }
    y = drawColumnHeaders(y);
    rows.forEach((row, i) => {
        if (y + rowHeight > pageHeight - 16) {
            drawPdfFooter(doc, pageNum);
            doc.addPage();
            pageNum += 1;
            y = 16;
            y = drawColumnHeaders(y);
        }
        if (i % 2 === 1) {
            doc.setFillColor(...PDF_COLORS.rowAlt);
            doc.rect(marginX, y, pageWidth - marginX * 2, rowHeight, "F");
        }
        doc.setTextColor(...PDF_COLORS.text);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(8.5);
        let x = marginX + 2;
        row.forEach((cell, ci) => {
            const text = String(cell == null ? "" : cell);
            const fitted = doc.splitTextToSize(text, columns[ci].width - 3)[0] || "";
            doc.text(fitted, x, y + 5.5);
            x += columns[ci].width;
        });
        y += rowHeight;
    });
    drawPdfFooter(doc, pageNum);
}
