      ) : (
        <div className="space-y-2">
          {rows.map((e, i) => {
            const sc = specialtyColor(e.specialty);
            return (
              <Card key={i} className="flex items-center justify-between" style={{ borderLeft: `4px solid ${sc.text}` }}>
                <div>
                  <NameBox name={e.name} specialty={e.specialty} />
                  <p className="font-body text-[11px] mt-1" style={{ color: C.textMuted }}>
                    {e.specialty}
                  </p>
                </div>
                {e.mobile ? (
                  <a
                    href={`tel:${e.mobile}`}
                    className="font-mono text-xs font-semibold px-2.5 py-1.5 rounded-lg"
                    style={{ backgroundColor: C.primarySoft, color: C.primaryDark }}
                  >
                    {e.mobile}
                  </a>
                ) : (
                  <Pill>—</Pill>
                )}
              </Card>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ---- Leave Tab ----
function LeaveTab({ currentUser, currentRole, leaves, setLeaves, specialties, rota, swaps, respondSwap, coordinatorDirectSwap }) {
  const allNamesForSwap = useMemo(() => {
    const s = new Set(rota.rows.map((r) => r.name).filter(Boolean));
    return Array.from(s).sort();
  }, [rota.rows]);
  const [dsPerson1, setDsPerson1] = useState("");
  const [dsDate1, setDsDate1] = useState("");
  const [dsPerson2, setDsPerson2] = useState("");
  const [dsDate2, setDsDate2] = useState("");
  const [dsNote, setDsNote] = useState("");
  const [dsBusy, setDsBusy] = useState(false);
  const [dsMsg, setDsMsg] = useState("");

  const dsRows1 = useMemo(() => {
    if (!dsPerson1) return [];
    const rows = rota.rows.filter((r) => sameName(r.name, dsPerson1) && r.date >= todayISO());
    return collapseByDay(rows).sort((a, b) => a.date.localeCompare(b.date));
  }, [rota.rows, dsPerson1]);

  const dsRows2 = useMemo(() => {
    if (!dsPerson2) return [];
    const rows = rota.rows.filter((r) => sameName(r.name, dsPerson2) && r.date >= todayISO());
    return collapseByDay(rows).sort((a, b) => a.date.localeCompare(b.date));
  }, [rota.rows, dsPerson2]);

  const handleDirectSwap = async () => {
    if (!dsPerson1.trim() || !dsDate1 || !dsPerson2.trim() || !dsDate2) return;
    setDsBusy(true);
    setDsMsg("");
    const ok = await coordinatorDirectSwap(dsDate1, dsPerson1, dsDate2, dsPerson2, dsNote);
    setDsBusy(false);
    if (ok) {
      setDsMsg("Swap applied to the rota.");
      setDsPerson1("");
      setDsDate1("");
      setDsPerson2("");
      setDsDate2("");
      setDsNote("");
    }
  };

  const [sub, setSub] = useState("request");
  const [form, setForm] = useState({ specialty: "", start: "", end: "", type: "Annual", attachment: "" });
  const [submitting, setSubmitting] = useState(false);
  const [err, setErr] = useState("");
  const [respondingId, setRespondingId] = useState(null);
  const [uploadingFile, setUploadingFile] = useState(false);
  const [uploadFileError, setUploadFileError] = useState("");
  const fileInputRef = useRef(null);

  const handleFileSelect = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setUploadFileError("");
    setUploadingFile(true);
    try {
      const { url, fileName } = await uploadSignedLeaveForm(file);
      setForm((f) => ({ ...f, attachment: url, attachmentName: fileName }));
    } catch (err) {
      setUploadFileError(err.message || "Upload failed — try again");
    } finally {
      setUploadingFile(false);
      if (fileInputRef.current) fileInputRef.current.value = "";
    }
  };

  const mine = leaves.filter((l) => l.name.toLowerCase().trim() === currentUser.toLowerCase().trim());

  const conflictsFor = (l) =>
    rota.rows.filter(
      (r) =>
        r.name.toLowerCase().trim() === l.name.toLowerCase().trim() &&
        r.date >= l.startDate &&
        r.date <= l.endDate
    );

  const conflicts = useMemo(() => {
    if (!form.start || !form.end || !currentUser) return [];
    return rota.rows.filter(
      (r) =>
        r.name.toLowerCase().trim() === currentUser.toLowerCase().trim() &&
        r.date >= form.start &&
        r.date <= form.end
    );
  }, [rota.rows, form.start, form.end, currentUser]);

  const submit = async () => {
    setErr("");
    if (!currentUser) {
      setErr("Set your name first from the Account tab");
      return;
    }
    if (!form.start || !form.end) {
      setErr("Set the start and end date");
      return;
    }
    setSubmitting(true);
    try {
      const entry = {
        id: `${Date.now()}`,
        name: currentUser,
        specialty: form.specialty === "Other" ? form.specialtyOther.trim() : form.specialty,
        startDate: form.start,
        endDate: form.end,
        type: form.type,
        attachment: form.attachment,
        status: "pending",
        submittedAt: new Date().toISOString(),
      };
      const nextLeaves = await submitLeaveToSheet(entry);
      setLeaves(nextLeaves);
      setForm({ specialty: "", start: "", end: "", type: "Annual", attachment: "" });
      setSub("mine");
    } catch (e) {
      setErr(e.message || "Couldn't reach Google Sheets — try again");
    } finally {
      setSubmitting(false);
    }
  };

  const updateStatus = async (id, status) => {
    if (respondingId) return;
    setRespondingId(id);
    try {
      const nextLeaves = await setLeaveStatusOnSheet(id, status);
      setLeaves(nextLeaves);
    } catch (e) {
      setErr(e.message || "Couldn't reach Google Sheets — try again");
    } finally {
      setRespondingId(null);
    }
  };

  const respondSwapWrapped = async (id, decision) => {
    if (respondingId) return;
    setRespondingId(id);
    try {
      await respondSwap(id, decision);
    } finally {
      setRespondingId(null);
    }
  };

  return (
    <div className="space-y-4 pt-1">
      <p className="font-display text-sm font-semibold" style={{ color: C.text }}>
        Leave Requests
      </p>

      <div className="flex gap-1.5 overflow-x-auto pb-1 -mx-1 px-1">
        <FilterChip label="New Request" active={sub === "request"} onClick={() => setSub("request")} />
        <FilterChip label="My Requests" active={sub === "mine"} onClick={() => setSub("mine")} />
        {currentRole === "coordinator" && (
          <FilterChip label="Review" active={sub === "review"} onClick={() => setSub("review")} />
        )}
        {currentRole === "coordinator" && (
          <FilterChip label="Swaps" active={sub === "swaps"} onClick={() => setSub("swaps")} />
        )}
      </div>

      {sub === "request" && (
        <Card className="space-y-3">
          <Field label="Specialty">
            <select
              value={form.specialty}
              onChange={(e) => setForm({ ...form, specialty: e.target.value, specialtyOther: "" })}
              className="w-full font-body text-sm px-3 py-2 rounded-lg outline-none"
              style={{ border: `1px solid ${C.border}`, color: C.text, backgroundColor: C.surface }}
            >
              <option value="">Select specialty</option>
              {specialties.map((s) => (
                <option key={s} value={s}>
                  {s}
                </option>
              ))}
              <option value="Other">Other</option>
            </select>
            {form.specialty === "Other" && (
              <input
                value={form.specialtyOther || ""}
                onChange={(e) => setForm({ ...form, specialtyOther: e.target.value })}
                className="w-full font-body text-sm px-3 py-2 rounded-lg outline-none mt-2"
                style={{ border: `1px solid ${C.border}`, color: C.text }}
                placeholder="Type specialty"
              />
            )}
          </Field>

          <div className="space-y-3">
            <Field label="From date">
              <input
                type="date"
                value={form.start}
                onChange={(e) => setForm({ ...form, start: e.target.value })}
                className="font-body text-sm py-3 rounded-lg outline-none block"
                style={{
                  border: `1px solid ${C.border}`,
                  color: C.text,
                  backgroundColor: C.surface,
                  width: "100%",
                  maxWidth: "100%",
                  minWidth: 0,
                  boxSizing: "border-box",
                  paddingLeft: 8,
                  paddingRight: 8,
                  overflow: "hidden",
                  WebkitAppearance: "none",
                  appearance: "none",
                }}
              />
            </Field>
            <Field label="To date">
              <input
                type="date"
                value={form.end}
                onChange={(e) => setForm({ ...form, end: e.target.value })}
                className="font-body text-sm py-3 rounded-lg outline-none block"
                style={{
                  border: `1px solid ${C.border}`,
                  color: C.text,
                  backgroundColor: C.surface,
                  width: "100%",
                  maxWidth: "100%",
                  minWidth: 0,
                  boxSizing: "border-box",
                  paddingLeft: 8,
                  paddingRight: 8,
                  overflow: "hidden",
                  WebkitAppearance: "none",
                  appearance: "none",
                }}
              />
            </Field>
          </div>

          {conflicts.length > 0 && (
            <div
              className="rounded-lg p-3 flex items-start gap-2"
              style={{ backgroundColor: C.amberSoft }}
            >
              <span>⚠️</span>
              <div>
                <p className="font-body text-xs font-semibold" style={{ color: C.amber }}>
                  You're already scheduled during this period
                </p>
                <ul className="mt-1 space-y-0.5">
                  {conflicts.map((c, i) => (
                    <li key={i} className="font-body text-[11px]" style={{ color: C.amber }}>
                      {formatDatePretty(c.date)} — {c.specialty} · {c.role}
                    </li>
                  ))}
                </ul>
                <p className="font-body text-[11px] mt-1" style={{ color: C.textMuted }}>
                  You can still submit — just make sure coverage is arranged with the coordinator.
                </p>
              </div>
            </div>
          )}

          <Field label="Leave type">
            <select
              value={form.type}
              onChange={(e) => setForm({ ...form, type: e.target.value })}
              className="w-full font-body text-sm px-3 py-2 rounded-lg outline-none"
              style={{ border: `1px solid ${C.border}`, color: C.text }}
            >
              <option>Annual</option>
              <option>Emergency</option>
              <option>Sick</option>
              <option>Other</option>
            </select>
          </Field>

          <Field label="Signed leave form">
            <input
              ref={fileInputRef}
              type="file"
              accept="image/*,.pdf"
              onChange={handleFileSelect}
              className="hidden"
              id="leave-form-file-input"
            />
            {!form.attachment ? (
              <label
                htmlFor="leave-form-file-input"
                className="w-full flex items-center justify-center gap-2 py-2.5 rounded-lg font-body text-sm cursor-pointer"
                style={{ border: `1px dashed ${C.border}`, color: C.textMuted }}
              >
                {uploadingFile ? (
                  <>
                    <span>🔄</span> Uploading…
                  </>
                ) : (
                  <>
                    <span>📤</span> Choose a photo or PDF
                  </>
                )}
              </label>
            ) : (
              <div
                className="w-full flex items-center justify-between gap-2 px-3 py-2.5 rounded-lg font-body text-sm"
                style={{ border: `1px solid ${C.success}`, backgroundColor: C.successSoft, color: C.success }}
              >
                <span className="flex items-center gap-2 min-w-0">
                  <span>✓</span>
                  <span className="truncate">{form.attachmentName || "Uploaded"}</span>
                </span>
                <button
                  onClick={() => setForm((f) => ({ ...f, attachment: "", attachmentName: "" }))}
                  className="shrink-0"
                  style={{ color: C.danger }}
                >
                  <span>✕</span>
                </button>
              </div>
            )}
            {uploadFileError && (
              <p className="font-body text-[11px] mt-1" style={{ color: C.danger }}>
                {uploadFileError}
              </p>
            )}
          </Field>

          {err && <p className="font-body text-xs" style={{ color: C.danger }}>{err}</p>}

          <button
            onClick={submit}
            disabled={submitting}
            className="w-full py-2.5 rounded-xl font-body text-sm font-medium"
            style={{ backgroundColor: C.primary, color: "white" }}
          >
            {submitting ? "Submitting..." : "Submit Request"}
          </button>
        </Card>
      )}

      {sub === "mine" &&
        (mine.length === 0 ? (
          <Card>
            <EmptyState icon={Plane} title="You have no leave requests" />
          </Card>
        ) : (
          <div className="space-y-2">
            {mine.map((l) => (
              <LeaveRow key={l.id} l={l} />
            ))}
          </div>
        ))}

      {sub === "review" &&
        currentRole === "coordinator" &&
        (leaves.length === 0 ? (
          <Card>
            <EmptyState icon={Plane} title="No requests yet" />
          </Card>
        ) : (
          <div className="space-y-2">
            {leaves
              .slice()
              .sort((a, b) => b.submittedAt.localeCompare(a.submittedAt))
              .map((l) => (
                <LeaveRow
                  key={l.id}
                  l={l}
                  showActions
                  onAction={updateStatus}
                  conflicts={conflictsFor(l)}
                  busy={respondingId === l.id}
                />
              ))}
          </div>
        ))}

      {sub === "swaps" && currentRole === "coordinator" && (
        <Card>
          <p className="font-body text-sm font-semibold mb-1" style={{ color: C.text }}>
            Force a Swap
          </p>
          <p className="font-body text-[11px] mb-3" style={{ color: C.textMuted }}>
            Applies immediately — no approval needed from either person.
          </p>
          <div className="space-y-2">
            <input
              list="ds-names-1"
              value={dsPerson1}
              onChange={(e) => {
                setDsPerson1(e.target.value);
                setDsDate1("");
              }}
              placeholder="First person"
              className="w-full font-body text-sm px-3 py-2 rounded-lg outline-none"
              style={{ border: `1px solid ${C.border}`, color: C.text }}
            />
            <datalist id="ds-names-1">
              {allNamesForSwap.map((n) => (
                <option key={n} value={n} />
              ))}
            </datalist>
            {dsPerson1 && (
              <select
                value={dsDate1}
                onChange={(e) => setDsDate1(e.target.value)}
                className="w-full font-body text-sm px-3 py-2 rounded-lg outline-none"
                style={{ border: `1px solid ${C.border}`, color: C.text, backgroundColor: C.surface }}
              >
                <option value="">{dsRows1.length ? "Pick their day" : "No upcoming calls found for this name"}</option>
                {dsRows1.map((r, i) => (
                  <option key={i} value={r.date}>
                    {formatDatePretty(r.date)} · {r.specialty} · {r.role}
                  </option>
                ))}
              </select>
            )}

            <input
              list="ds-names-2"
              value={dsPerson2}
              onChange={(e) => {
                setDsPerson2(e.target.value);
                setDsDate2("");
              }}
              placeholder="Second person"
              className="w-full font-body text-sm px-3 py-2 rounded-lg outline-none"
              style={{ border: `1px solid ${C.border}`, color: C.text }}
            />
            <datalist id="ds-names-2">
              {allNamesForSwap.map((n) => (
                <option key={n} value={n} />
              ))}
            </datalist>
            {dsPerson2 && (
              <select
                value={dsDate2}
                onChange={(e) => setDsDate2(e.target.value)}
                className="w-full font-body text-sm px-3 py-2 rounded-lg outline-none"
                style={{ border: `1px solid ${C.border}`, color: C.text, backgroundColor: C.surface }}
              >
                <option value="">{dsRows2.length ? "Pick their day" : "No upcoming calls found for this name"}</option>
                {dsRows2.map((r, i) => (
                  <option key={i} value={r.date}>
                    {formatDatePretty(r.date)} · {r.specialty} · {r.role}
                  </option>
                ))}
              </select>
            )}

            <input
              value={dsNote}
              onChange={(e) => setDsNote(e.target.value)}
              placeholder="Note (optional)"
              className="w-full font-body text-sm px-3 py-2 rounded-lg outline-none"
              style={{ border: `1px solid ${C.border}`, color: C.text }}
            />
            <button
              onClick={handleDirectSwap}
              disabled={dsBusy || !dsPerson1.trim() || !dsDate1 || !dsPerson2.trim() || !dsDate2}
              className="w-full py-2.5 rounded-lg font-body text-sm font-medium flex items-center justify-center gap-2"
              style={{
                backgroundColor: C.primary,
                color: "white",
                opacity: dsBusy || !dsPerson1.trim() || !dsDate1 || !dsPerson2.trim() || !dsDate2 ? 0.5 : 1,
              }}
            >
              {dsBusy ? <span>🔄</span> : "Apply Swap Now"}
            </button>
            {dsMsg && (
              <p className="font-body text-[11px] text-center" style={{ color: C.success }}>
                {dsMsg}
              </p>
            )}
          </div>
        </Card>
      )}

      {sub === "swaps" &&
        currentRole === "coordinator" &&
        (swaps.length === 0 ? (
          <Card>
            <EmptyState icon={Plane} title="No swap requests yet" />
          </Card>
        ) : (
          <div className="space-y-2">
            {swaps
              .slice()
              .sort((a, b) => b.submittedAt.localeCompare(a.submittedAt))
              .map((s) => {
                const toneMap = {
                  pending_colleague: "amber",
                  pending_coordinator: "amber",
                  accepted: "success",
                  declined_by_colleague: "danger",
                  declined_by_coordinator: "danger",
                };
                const labelMap = {
                  pending_colleague: "Waiting on colleague",
                  pending_coordinator: "Ready for you",
                  accepted: "Approved",
                  declined_by_colleague: "Declined by colleague",
                  declined_by_coordinator: "Declined by you",
                };
                return (
                  <Card key={s.id}>
                    <div className="flex items-center justify-between mb-1.5">
                      <p className="font-body text-sm font-medium" style={{ color: C.text }}>
                        {s.fromName} ⇄ {s.toName}
                      </p>
                      <Pill tone={toneMap[s.status] || "muted"}>{labelMap[s.status] || s.status}</Pill>
                    </div>
                    <p className="font-mono text-xs" style={{ color: C.textMuted }}>
                      {s.fromName} gives: {formatDatePretty(s.fromDate)} · {s.fromSpecialty ? `${s.fromSpecialty} · ` : ""}{(s.fromRoles || []).join(", ") || "—"}
                    </p>
                    <p className="font-mono text-xs mt-0.5" style={{ color: C.textMuted }}>
                      {s.toName} gives: {formatDatePretty(s.toDate)} · {s.toSpecialty ? `${s.toSpecialty} · ` : ""}{(s.toRoles || []).join(", ") || "—"}
                    </p>
                    {s.note && (
                      <p className="font-body text-xs mt-1 italic" style={{ color: C.textMuted }}>
                        "{s.note}"
                      </p>
                    )}
                    {s.status === "pending_colleague" && (
                      <p className="font-body text-[11px] mt-2" style={{ color: C.textMuted }}>
                        Not ready for you yet — {s.toName} still needs to approve first.
                      </p>
                    )}
                    {s.status === "pending_coordinator" && (
                      <div className="flex gap-2 mt-3">
                        <button
                          onClick={() => respondSwapWrapped(s.id, "accepted")}
                          disabled={respondingId === s.id}
                          className="flex-1 flex items-center justify-center gap-1 py-1.5 rounded-lg font-body text-xs font-medium"
                          style={{ backgroundColor: C.successSoft, color: C.success, opacity: respondingId === s.id ? 0.6 : 1 }}
                        >
                          {respondingId === s.id ? (
                            <span>🔄</span>
                          ) : (
                            <>
                              <span>✓</span> Approve
                            </>
                          )}
                        </button>
                        <button
                          onClick={() => respondSwapWrapped(s.id, "declined")}
                          disabled={respondingId === s.id}
                          className="flex-1 flex items-center justify-center gap-1 py-1.5 rounded-lg font-body text-xs font-medium"
                          style={{ backgroundColor: C.dangerSoft, color: C.danger, opacity: respondingId === s.id ? 0.6 : 1 }}
                        >
                          {respondingId === s.id ? (
                            <span>🔄</span>
                          ) : (
                            <>
                              <span>✕</span> Reject
                            </>
                          )}
                        </button>
                      </div>
                    )}
                  </Card>
                );
              })}
          </div>
        ))}
    </div>
  );
}

// Replaces the native <input type="date"> (which has an iOS quirk where its
// internal width can't be constrained) with three plain selects — these
// never overflow their container on any device.
function DateSelect({ value, onChange }) {
  const today = new Date();
  const [vy, vm, vd] = value
    ? value.split("-").map(Number)
    : [today.getFullYear(), today.getMonth() + 1, today.getDate()];

  const commit = (d, m, y) => {
    const mm = String(m).padStart(2, "0");
    const dd = String(d).padStart(2, "0");
    onChange(`${y}-${mm}-${dd}`);
  };

  const days = Array.from({ length: 31 }, (_, i) => i + 1);
  const monthNames = [
    "Jan", "Feb", "Mar", "Apr", "May", "Jun",
    "Jul", "Aug", "Sep", "Oct", "Nov", "Dec",
  ];
  const years = [today.getFullYear(), today.getFullYear() + 1];

  const selectStyle = {
    border: `1px solid ${C.border}`,
    color: C.text,
    backgroundColor: C.surface,
  };
  const selectClass = "font-body text-sm py-2.5 rounded-lg outline-none text-center";

  return (
    <div className="grid grid-cols-3 gap-1.5">
      <select
        value={vd}
        onChange={(e) => commit(Number(e.target.value), vm, vy)}
        className={selectClass}
        style={selectStyle}
      >
        {days.map((d) => (
          <option key={d} value={d}>
            {d}
          </option>
        ))}
      </select>
      <select
        value={vm}
        onChange={(e) => commit(vd, Number(e.target.value), vy)}
        className={selectClass}
        style={selectStyle}
      >
        {monthNames.map((name, i) => (
          <option key={name} value={i + 1}>
            {name}
          </option>
        ))}
      </select>
      <select
        value={vy}
        onChange={(e) => commit(vd, vm, Number(e.target.value))}
        className={selectClass}
        style={selectStyle}
      >
        {years.map((y) => (
          <option key={y} value={y}>
            {y}
          </option>
        ))}
      </select>
    </div>
  );
}

function Field({ label, children, className = "" }) {
  return (
    <div className={className}>
      <label className="font-body text-[11px] font-medium block mb-1" style={{ color: C.textMuted }}>
        {label}
      </label>
      {children}
    </div>
  );
}

      </div>
      <p className="font-body text-xs" style={{ color: C.textMuted }}>
        {l.specialty || "—"} · {l.type}
      </p>
      <p className="font-mono text-xs mt-1" style={{ color: C.text }}>
        {formatDatePretty(l.startDate)} → {formatDatePretty(l.endDate)}
      </p>
      {l.attachment && (
        <a
          href={l.attachment}
          target="_blank"
          rel="noopener noreferrer"
          className="font-body text-[11px] font-medium mt-1 inline-flex items-center gap-1"
          style={{ color: C.primary }}
        >
          <span>📎</span> View signed form
        </a>
      )}
      {conflicts && conflicts.length > 0 && (
        <div className="rounded-lg p-2 mt-2 flex items-start gap-1.5" style={{ backgroundColor: C.amberSoft }}>
          <span>⚠️</span>
          <div>
            <p className="font-body text-[11px] font-semibold" style={{ color: C.amber }}>
              Clashes with {conflicts.length} rota entr{conflicts.length === 1 ? "y" : "ies"}
            </p>
            {conflicts.map((c, i) => (
              <p key={i} className="font-body text-[11px]" style={{ color: C.amber }}>
                {formatDatePretty(c.date)} — {c.specialty} ({c.role})
              </p>
            ))}
          </div>
        </div>
      )}
      {showActions && l.status === "pending" && (
        <div className="flex gap-2 mt-3">
          <button
            onClick={() => onAction(l.id, "approved")}
            disabled={busy}
            className="flex-1 flex items-center justify-center gap-1 py-1.5 rounded-lg font-body text-xs font-medium"
            style={{ backgroundColor: C.successSoft, color: C.success, opacity: busy ? 0.6 : 1 }}
          >
            {busy ? (
              <span>🔄</span>
            ) : (
              <>
                <span>✓</span> Approve
              </>
            )}
          </button>
          <button
            onClick={() => onAction(l.id, "rejected")}
            disabled={busy}
            className="flex-1 flex items-center justify-center gap-1 py-1.5 rounded-lg font-body text-xs font-medium"
            style={{ backgroundColor: C.dangerSoft, color: C.danger, opacity: busy ? 0.6 : 1 }}
          >
            {busy ? (
              <span>🔄</span>
            ) : (
              <>
                <span>✕</span> Reject
              </>
            )}
          </button>
        </div>
      )}
    </Card>
  );
}

// ---- Account Tab ----
function AccountTab({ currentUser, currentRole, nameDraft, setNameDraft, roleDraft, setRoleDraft, saveUser, onBack }) {
  const [code, setCode] = useState("");
  const [codeError, setCodeError] = useState("");
  const wantsCoordinator = (roleDraft || currentRole) === "coordinator";

  const handleSave = async () => {
    setCodeError("");
    const chosenRole = roleDraft || currentRole;
    if (chosenRole === "coordinator" && code.trim() !== COORDINATOR_CODE) {
      setCodeError("Wrong access code — ask the rota lead for the current code");
      return;
    }
    await saveUser(nameDraft || currentUser, chosenRole);
    onBack();
  };

  return (
    <div className="space-y-4 pt-1">
      <p className="font-display text-sm font-semibold" style={{ color: C.text }}>
        Account
      </p>
      <Card className="space-y-3">
        <Field label="Your name (exactly as written in the rota file)">
          <input
            defaultValue={currentUser}
            onChange={(e) => setNameDraft(e.target.value)}
            className="w-full font-body text-sm px-3 py-2 rounded-lg outline-none"
            style={{ border: `1px solid ${C.border}`, color: C.text }}
            placeholder="e.g. Dr. Mohamed Khamis"
          />
        </Field>
        <Field label="Your role">
          <div className="flex gap-2">
            {["doctor", "coordinator"].map((r) => {
              const active = (roleDraft || currentRole) === r;
              return (
                <button
                  key={r}
                  onClick={() => setRoleDraft(r)}
                  className="flex-1 py-2 rounded-lg font-body text-sm font-medium capitalize"
                  style={{
                    backgroundColor: active ? C.primary : C.surfaceMuted,
                    color: active ? "white" : C.textMuted,
                  }}
                >
                  {r}
                </button>
              );
            })}
          </div>
          <p className="font-body text-[11px] mt-1" style={{ color: C.textMuted }}>
            Only the rota coordinator can upload/update the rota and review leave requests.
          </p>
        </Field>

        {wantsCoordinator && (
          <Field label="Coordinator access code">
            <input
              type="password"
              value={code}
              onChange={(e) => setCode(e.target.value)}
              className="w-full font-mono text-sm px-3 py-2 rounded-lg outline-none"
              style={{ border: `1px solid ${C.border}`, color: C.text }}
              placeholder="Ask the rota lead for this"
            />
            {codeError && (
              <p className="font-body text-[11px] mt-1" style={{ color: C.danger }}>
                {codeError}
              </p>
            )}
          </Field>
        )}

        <button
          onClick={handleSave}
          className="w-full py-2.5 rounded-xl font-body text-sm font-medium flex items-center justify-center gap-1.5"
          style={{ backgroundColor: C.primary, color: "white" }}
        >
          Save <span>›</span>
        </button>
      </Card>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<RotaApp />);

</script>
</body>
</html>
